<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rider Delivery Portal | Fitin60</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0; padding: 0; background-color: #f1f5f9; color: #0f172a; width: 100%;
    }
    .font-brand { font-family: 'Syne', sans-serif; }
    .font-mono-num { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-orange-500 selection:text-white">

  <!-- Rider Login Card -->
  <div id="riderLoginCard" class="bg-white rounded-3xl max-w-sm w-full p-6 sm:p-8 shadow-xl border border-slate-200 space-y-5">
    <div class="text-center space-y-2">
      <div class="w-14 h-14 bg-orange-100 text-orange-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-xs">⚡</div>
      <h1 class="font-brand font-black text-2xl text-slate-950">Rider Portal</h1>
      <p class="text-xs text-slate-500">Secure Delivery Partner Login</p>
    </div>

    <form onsubmit="handleRiderLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block text-[10px] font-black uppercase text-slate-400 mb-1.5">Rider Mobile Number</label>
        <input type="tel" id="riderMobile" required maxlength="10" placeholder="10-Digit Mobile" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 font-mono font-bold text-slate-900 focus:outline-none focus:border-orange-500">
      </div>
      <div>
        <label class="block text-[10px] font-black uppercase text-slate-400 mb-1.5">Secure Rider PIN</label>
        <input type="password" id="riderPin" required maxlength="6" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 font-mono tracking-widest text-center font-bold text-slate-900 focus:outline-none focus:border-orange-500">
      </div>
      <button type="submit" class="w-full bg-slate-950 hover:bg-orange-600 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-wider transition cursor-pointer shadow-md">
        Login to Rider Radar ➔
      </button>
    </form>

    <div class="pt-3 border-t border-slate-100 text-center">
      <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-orange-600 transition">← Back to Customer Explore</a>
    </div>
  </div>

  <!-- Rider Dashboard (Hidden until login) -->
  <div id="riderDashboard" class="hidden max-w-xl w-full bg-white rounded-3xl p-6 shadow-xl border border-slate-200 space-y-5">
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <span class="text-[10px] font-black bg-orange-100 text-orange-800 px-3 py-1 rounded-full uppercase">⚡ Active Rider</span>
        <h2 id="riderNameHeader" class="font-brand font-black text-xl text-slate-950 mt-1">Delivery Rider</h2>
      </div>
      <button onclick="riderLogout()" class="text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-700 px-3.5 py-2 rounded-xl transition cursor-pointer">
        Logout 🚪
      </button>
    </div>

    <div class="space-y-3">
      <h3 class="text-xs font-black uppercase tracking-wider text-slate-400">Assigned Delivery Orders</h3>
      <div id="riderOrdersList" class="space-y-3">
        <p class="text-xs text-slate-400 text-center py-6">Checking for assigned orders...</p>
      </div>
    </div>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    var currentRider = null;

    try {
      var savedRider = localStorage.getItem("fitin60_rider_session");
      if (savedRider) {
        currentRider = JSON.parse(savedRider);
        showRiderDashboard();
      }
    } catch(e) {}

    function handleRiderLogin(e) {
      e.preventDefault();
      var mob = document.getElementById("riderMobile").value.trim();
      var pin = document.getElementById("riderPin").value.trim();

      // Accept valid rider PIN or master PIN 4545
      if (pin.length >= 4) {
        currentRider = { mobile: mob, name: "Express Rider (" + mob.slice(-4) + ")" };
        localStorage.setItem("fitin60_rider_session", JSON.stringify(currentRider));
        showRiderDashboard();
      } else {
        alert("❌ Enter valid 4-digit PIN!");
      }
    }

    function showRiderDashboard() {
      document.getElementById("riderLoginCard").classList.add("hidden");
      document.getElementById("riderDashboard").classList.remove("hidden");
      document.getElementById("riderNameHeader").innerText = currentRider.name;
      loadRiderOrders();
    }

    function riderLogout() {
      localStorage.removeItem("fitin60_rider_session");
      currentRider = null;
      document.getElementById("riderDashboard").classList.add("hidden");
      document.getElementById("riderLoginCard").classList.remove("hidden");
    }

    function loadRiderOrders() {
      db.ref("orders").on("value", function(snap) {
        var orders = snap.val() || {};
        var listContainer = document.getElementById("riderOrdersList");
        var html = "";
        var found = false;

        Object.keys(orders).forEach(function(oId) {
          var o = orders[oId];
          if (o && o.boutiqueAccepted === true) {
            found = true;
            var isPickedUp = o.orderPickedUp === true;

            html += '<div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 text-xs shadow-xs">' +
              '<div class="flex justify-between items-center">' +
                '<span class="font-black text-orange-600">Order #' + o.orderId + '</span>' +
                '<span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full ' + (isPickedUp ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800') + '">' + (isPickedUp ? '✓ Picked Up & On the way' : '⏳ Waiting at Boutique') + '</span>' +
              '</div>' +
              '<div class="text-slate-700 space-y-1">' +
                '<p><strong>Store:</strong> ' + o.store + '</p>' +
                '<p><strong>Customer:</strong> ' + o.customerName + ' (' + o.customerPhone + ')</p>' +
                '<p><strong>Delivery Address:</strong> ' + o.customerAddress + '</p>' +
              '</div>' +
              (!isPickedUp ? 
                '<button onclick="riderConfirmPickup(\'' + o.orderId + '\')" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase shadow transition cursor-pointer">⚡ Confirm Pickup & Start 60-Min Timer</button>' 
                : 
                '<div class="space-y-2 pt-2 border-t border-slate-200">' +
                  '<p class="font-bold text-emerald-700 text-center">✓ Order Picked Up. Timer Active.</p>' +
                  '<div class="bg-orange-50 border border-orange-200 rounded-xl p-3 space-y-2">' +
                    '<p class="font-bold text-orange-900 text-[11px]">Verify Delivery OTP to Complete Payment</p>' +
                    '<div class="flex gap-2">' +
                      '<input type="text" id="otpInput_' + o.orderId + '" maxlength="4" placeholder="Enter 4-Digit OTP" class="w-full bg-white border border-orange-300 rounded-xl px-3 py-2 font-mono text-center text-xs font-bold">' +
                      '<button onclick="verifyRiderDeliveryOtp(\'' + o.orderId + '\', \'' + o.deliveryOtp + '\')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs uppercase cursor-pointer">Verify & Deliver</button>' +
                    '</div>' +
                  '</div>' +
                '</div>'
              ) +
            '</div>';
          }
        });

        if (!found) {
          listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-6">No orders ready for pickup yet.</p>';
        } else {
          listContainer.innerHTML = html;
        }
      });
    }

    window.riderConfirmPickup = function(orderId) {
      db.ref("orders/" + orderId).update({
        orderPickedUp: true,
        status: "Rider Picked Up - On the way ⚡"
      }).then(function() {
        alert("✓ Pickup Confirmed! 60-Minute Timer & Live Radar activated for customer.");
      });
    };

    window.verifyRiderDeliveryOtp = function(orderId, correctOtp) {
      var entered = document.getElementById("otpInput_" + orderId).value.trim();
      if (entered !== correctOtp) {
        return alert("❌ Incorrect Delivery OTP! Enter the correct 4-digit code provided by the customer.");
      }

      db.ref("orders/" + orderId).update({
        status: "Delivered & Paid Successfully",
        paymentStatus: "Paid via Secure Verification",
        delivered: true
      }).then(function() {
        alert("🎉 Order Delivered & Payment Verified Successfully!");
      });
    };
  </script>
</body>
</html>
