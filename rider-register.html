<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fitin60 | Rider Fleet Registration</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafaf9; color: #0f172a; }
    .font-brand { font-family: 'Syne', sans-serif; }
    #quickToast { transform: translateY(100px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; }
    #quickToast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body class="min-h-screen pb-16 antialiased flex flex-col justify-between">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 h-16 flex items-center justify-between shadow-sm">
    <a href="index.html" class="flex items-center gap-1">
      <span class="font-brand text-2xl font-black text-slate-950">FITIN<span class="text-orange-600">60</span></span>
      <span class="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">RIDER REGISTRATION</span>
    </a>
    <a href="rider.html" class="text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">← Rider Fleet</a>
  </header>

  <main class="max-w-md mx-auto px-4 mt-6 w-full space-y-5">
    
    <div class="bg-slate-950 text-white rounded-3xl p-6 shadow-xl space-y-2">
      <h2 class="font-brand font-black text-xl text-white">Join Fitin60 Delivery Fleet</h2>
      <p class="text-xs text-slate-400">Register as an express delivery partner to fulfill 60-minute fashion orders.</p>
    </div>

    <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm">
      <form onsubmit="handleRiderRegistration(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Full Name</label>
          <input type="text" id="regRiderName" required placeholder="e.g. Rajesh Kumar" class="w-full bg-slate-50 border rounded-xl p-3 focus:outline-none focus:border-emerald-500 font-bold text-slate-900">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Mobile Number (Login ID)</label>
          <input type="tel" id="regRiderPhone" required placeholder="9515552511" class="w-full bg-slate-50 border rounded-xl p-3 focus:outline-none focus:border-emerald-500 font-mono text-slate-900">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Vehicle Type & Number</label>
          <input type="text" id="regRiderVehicle" required placeholder="e.g. Honda Activa • AP 21 X 4545" class="w-full bg-slate-50 border rounded-xl p-3 focus:outline-none focus:border-emerald-500 text-slate-900">
        </div>

        <!-- Secure ID / Address Proof Upload -->
        <div>
          <label class="block font-bold text-slate-700 mb-1">Government ID / Aadhaar / Driving Licence</label>
          <div class="relative border-2 border-dashed border-slate-300 hover:border-emerald-500 bg-slate-50 rounded-2xl p-4 text-center cursor-pointer transition">
            <input type="file" id="regRiderIdProof" accept="image/*" required onchange="handleRiderIdPreview(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
            <div id="riderIdPrompt" class="space-y-1">
              <span class="text-2xl block">🛵</span>
              <p class="font-bold text-slate-800 text-xs">Upload Driving Licence / ID Proof</p>
              <p class="text-[10px] text-slate-400">Strictly confidential (Admin verification only)</p>
            </div>
            <div id="riderIdPreviewContainer" class="hidden flex-col items-center gap-2">
              <img id="riderIdPreview" src="" alt="ID Preview" class="w-28 h-20 object-cover rounded-xl border border-slate-200 shadow-sm">
              <span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">✓ ID Uploaded</span>
            </div>
          </div>
        </div>

        <button type="submit" id="riderRegBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow">
          Register & Join Fleet
        </button>
      </form>
    </div>

  </main>

  <!-- Toast Notification -->
  <div id="quickToast" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-50 bg-slate-950/90 backdrop-blur-md text-white text-xs font-bold px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 border border-slate-800 pointer-events-none">
    <span class="text-emerald-400">✓</span>
    <span id="toastMsg">Success</span>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    function showQuickToast(msg) {
      var toast = document.getElementById("quickToast");
      var text = document.getElementById("toastMsg");
      text.innerText = msg;
      toast.classList.add("show");
      setTimeout(function() { toast.classList.remove("show"); }, 1500);
    }

    window.handleRiderIdPreview = function(event) {
      var input = event.target;
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("riderIdPreview").src = e.target.result;
          document.getElementById("riderIdPrompt").classList.add("hidden");
          document.getElementById("riderIdPreviewContainer").classList.remove("hidden");
        };
        reader.readAsDataURL(input.files[0]);
      }
    };

    window.handleRiderRegistration = function(e) {
      e.preventDefault();
      var name = document.getElementById("regRiderName").value.trim();
      var phone = document.getElementById("regRiderPhone").value.trim();
      var vehicle = document.getElementById("regRiderVehicle").value.trim();
      var fileInput = document.getElementById("regRiderIdProof");
      var btn = document.getElementById("riderRegBtn");

      if (!fileInput.files || fileInput.files.length === 0) {
        return alert("Please upload ID proof!");
      }

      var file = fileInput.files[0];
      btn.innerText = "⏳ Submitting Registration...";
      btn.disabled = true;

      var reader = new FileReader();
      reader.onload = function(uploadEvent) {
        var base64Id = uploadEvent.target.result;
        var riderKey = "rider_" + phone.replace(/[^0-9]/g, "");

        var riderData = {
          name: name,
          phone: phone,
          vehicle: vehicle,
          idProof: base64Id, // Secure for Admin/Owner view
          status: "ONLINE",
          timestamp: Date.now()
        };

        db.ref("riders/" + riderKey).set(riderData).then(function() {
          localStorage.setItem("fitin60_rider_name", name);
          localStorage.setItem("fitin60_rider_id", riderKey);
          
          showQuickToast("✓ Rider registration successful!");
          setTimeout(function() {
            window.location.href = "rider.html";
          }, 1200);
        }).catch(function(err) {
          btn.innerText = "Register & Join Fleet";
          btn.disabled = false;
          alert("Error: " + err.message);
        });
      };
      reader.readAsDataURL(file);
    };
  </script>
</body>
</html>
