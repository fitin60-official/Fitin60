<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fitin60 | Rider Fleet Station</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden !important; width: 100% !important; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Syne', sans-serif; }
    .font-mono-num { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#fafaf9] text-slate-900 min-h-screen pb-24 antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header -->
  <header class="bg-slate-950 text-white border-b border-slate-800 px-4 h-16 flex items-center justify-between shadow-md sticky top-0 z-40">
    <div class="flex items-center gap-2">
      <span class="font-brand text-lg font-black tracking-tight">FITIN<span class="text-emerald-400">60</span></span>
      <span class="text-[9px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-2 py-0.5 rounded-full">RIDER FLEET</span>
    </div>

    <div class="flex items-center gap-2">
      <button id="logoutRiderBtn" onclick="riderLogout()" class="hidden text-xs font-bold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 px-3 py-1.5 rounded-xl transition cursor-pointer">
        🚪 Exit Shift
      </button>
      <a href="index.html" class="text-xs font-bold bg-white/10 hover:bg-white/20 text-slate-300 px-3 py-1.5 rounded-xl transition">
        ← Store
      </a>
    </div>
  </header>

  <main class="w-full max-w-xl mx-auto px-4 mt-5 space-y-5">

    <!-- 1. RIDER AUTHENTICATION -->
    <div id="riderAuthBox" class="bg-white p-6 rounded-3xl border border-slate-200 shadow-xl space-y-4">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mx-auto shadow-sm">🛵</div>
        <h2 class="font-brand font-black text-xl text-slate-950 mt-1">Rider Fleet Shift Station</h2>
        <p class="text-xs text-slate-500">Fast doorstep deliveries with secure 4-digit OTP verification.</p>
      </div>

      <div class="flex bg-slate-100 p-1 rounded-2xl">
        <button onclick="switchRiderTab('login')" id="tabRiderLogin" class="flex-1 py-2 text-xs font-bold rounded-xl bg-white text-slate-950 shadow-sm transition cursor-pointer">Rider Login</button>
        <button onclick="switchRiderTab('register')" id="tabRiderRegister" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 transition cursor-pointer">Join Fleet</button>
      </div>

      <!-- Rider Login -->
      <form id="riderLoginForm" onsubmit="handleRiderLogin(event)" class="space-y-3.5">
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Registered Mobile Number</label>
          <input type="tel" id="riderLoginMobile" required maxlength="10" placeholder="10-Digit Mobile" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs font-mono focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Rider 4-Digit PIN</label>
          <input type="password" id="riderLoginPin" required maxlength="4" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-3 text-xs font-mono tracking-widest text-center focus:outline-none focus:border-emerald-500">
        </div>
        <button type="submit" class="w-full bg-slate-950 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-md cursor-pointer">
          Start Active Shift ➔
        </button>
      </form>

      <!-- Rider Register -->
      <form id="riderRegisterForm" onsubmit="handleRiderRegister(event)" class="space-y-3.5 hidden">
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Rider Full Name</label>
          <input type="text" id="regRiderName" required placeholder="e.g., Rajesh Kumar" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Vehicle Details</label>
          <input type="text" id="regRiderVehicle" required placeholder="e.g., Hero Splendor (AP 02 XX 1234)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Mobile Number</label>
          <input type="tel" id="regRiderMobile" required maxlength="10" placeholder="10-Digit Mobile" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-mono">
        </div>
        <div>
          <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Create 4-Digit PIN</label>
          <input type="password" id="regRiderPin" required maxlength="4" placeholder="••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs tracking-widest font-mono text-center">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-md cursor-pointer">
          Register & Activate Fleet Pass ➔
        </button>
      </form>
    </div>

    <!-- 2. RIDER DASHBOARD -->
    <div id="riderDashboard" class="hidden space-y-5">
      
      <!-- Shift Header Card -->
      <div class="bg-slate-950 text-white p-5 rounded-3xl flex items-center justify-between shadow-xl">
        <div class="flex items-center gap-3">
          <span class="text-3xl">🛵</span>
          <div>
            <h2 class="font-brand font-black text-lg" id="dashRiderName">Rajesh</h2>
            <p class="text-[11px] text-emerald-400" id="dashRiderVehicle">🏍️ Bike Active</p>
          </div>
        </div>
        <span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold px-2.5 py-1 rounded-full">
          ● ON DUTY
        </span>
      </div>

      <!-- Live Available Deliveries Pool -->
      <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-brand font-bold text-sm text-slate-950 uppercase tracking-wider">Available Pickups</h3>
          <span id="poolCountBadge" class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full">0 Orders</span>
        </div>
        <div id="riderOrdersPool" class="space-y-3"></div>
      </div>

    </div>

  </main>

  <!-- SECURE CUSTOMER OTP MODAL -->
  <div id="otpVerifyModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center space-y-4 shadow-2xl relative border border-slate-200">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl mx-auto">🔑</div>
      <div>
        <h3 class="font-brand font-black text-base text-slate-950">Customer Delivery OTP</h3>
        <p class="text-xs text-slate-500 mt-1">Ask customer for the 4-digit code shown on their tracking screen.</p>
      </div>

      <input type="hidden" id="otpTargetOrderId" value="">
      <input type="hidden" id="otpExpectedCode" value="">

      <div>
        <input type="tel" id="enteredCustomerOtp" maxlength="4" placeholder="••••" class="w-full bg-slate-50 border-2 border-slate-300 rounded-2xl py-3 text-center font-mono-num text-2xl font-black tracking-widest text-slate-950 focus:outline-none focus:border-emerald-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="closeOtpModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs cursor-pointer">
          Cancel
        </button>
        <button onclick="verifyAndCompleteDelivery()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs cursor-pointer shadow-md">
          Verify & Finish
        </button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var currentRider = null;

    function switchRiderTab(tab) {
      var logF = document.getElementById("riderLoginForm");
      var regF = document.getElementById("riderRegisterForm");

      if (tab === 'login') {
        logF.classList.remove("hidden");
        regF.classList.add("hidden");
        document.getElementById("tabRiderLogin").className = "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-slate-950 shadow-sm transition cursor-pointer";
        document.getElementById("tabRiderRegister").className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 transition cursor-pointer";
      } else {
        logF.classList.add("hidden");
        regF.classList.remove("hidden");
        document.getElementById("tabRiderRegister").className = "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-slate-950 shadow-sm transition cursor-pointer";
        document.getElementById("tabRiderLogin").className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 transition cursor-pointer";
      }
    }

    function handleRiderRegister(e) {
      e.preventDefault();
      var name = document.getElementById("regRiderName").value.trim();
      var vehicle = document.getElementById("regRiderVehicle").value.trim();
      var mobile = document.getElementById("regRiderMobile").value.trim();
      var pin = document.getElementById("regRiderPin").value.trim();

      var riderId = "R-" + Math.floor(100 + Math.random() * 900);
      var newRider = { riderId: riderId, name: name, vehicle: vehicle, mobile: mobile, pin: pin };

      db.ref("riders/" + mobile).set(newRider).then(function() {
        alert("✓ Rider Registered! Starting Shift...");
        riderLoginSuccess(newRider);
      });
    }

    function handleRiderLogin(e) {
      e.preventDefault();
      var mobile = document.getElementById("riderLoginMobile").value.trim();
      var pin = document.getElementById("riderLoginPin").value.trim();

      db.ref("riders/" + mobile).once("value").then(function(snapshot) {
        var rider = snapshot.val();
        if (rider && rider.pin === pin) {
          riderLoginSuccess(rider);
        } else {
          alert("Invalid Mobile or PIN!");
        }
      });
    }

    function riderLoginSuccess(rider) {
      currentRider = rider;
      localStorage.setItem("fitin60_active_rider", JSON.stringify(rider));

      document.getElementById("riderAuthBox").classList.add("hidden");
      document.getElementById("riderDashboard").classList.remove("hidden");
      document.getElementById("logoutRiderBtn").classList.remove("hidden");

      document.getElementById("dashRiderName").innerText = rider.name;
      document.getElementById("dashRiderVehicle").innerText = "🏍️ " + rider.vehicle;

      listenToRiderOrders();
    }

    function riderLogout() {
      currentRider = null;
      localStorage.removeItem("fitin60_active_rider");
      document.getElementById("riderAuthBox").classList.remove("hidden");
      document.getElementById("riderDashboard").classList.add("hidden");
      document.getElementById("logoutRiderBtn").classList.add("hidden");
    }

    function listenToRiderOrders() {
      db.ref("orders").on("value", function(snapshot) {
        var orders = snapshot.val();
        var pool = document.getElementById("riderOrdersPool");
        var badge = document.getElementById("poolCountBadge");

        if (!orders) {
          badge.innerText = "0 Orders";
          pool.innerHTML = "<p class='text-slate-400 text-center py-4 text-xs'>No orders right now.</p>";
          return;
        }

        // Available orders: Either accepted by boutique and waiting for pickup, OR assigned to this rider
        var activeList = Object.values(orders).filter(function(o) {
          return (o.boutiqueAccepted && !o.riderAssigned) || (o.riderAssigned && o.riderPhone === currentRider.mobile && o.status !== "Delivered");
        }).reverse();

        badge.innerText = activeList.length + " Active";

        if (activeList.length === 0) {
          pool.innerHTML = "<p class='text-slate-400 text-center py-4 text-xs'>No active deliveries right now.</p>";
          return;
        }

        var html = "";
        activeList.forEach(function(o) {
          var isAssignedToMe = (o.riderAssigned && o.riderPhone === currentRider.mobile);

          html += 
            '<div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl space-y-2.5 text-xs">' +
              '<div class="flex justify-between items-start">' +
                '<div>' +
                  '<span class="font-mono font-black text-slate-950 text-sm">' + o.orderId + '</span>' +
                  '<p class="text-orange-600 font-bold text-[11px]">🏬 Pickup: ' + o.store + '</p>' +
                '</div>' +
                '<span class="font-mono-num font-black text-emerald-600 text-sm">₹' + o.totalAmount + '</span>' +
              '</div>' +

              '<div class="p-2.5 bg-white rounded-xl border border-slate-200 space-y-1 text-[11px]">' +
                '<p class="text-slate-900 font-bold">📍 Deliver to: ' + o.customerName + ' (' + o.customerPhone + ')</p>' +
                '<p class="text-slate-500">🏠 Address: ' + o.customerAddress + '</p>' +
                '<p class="text-slate-500">💵 Payment: <strong class="text-slate-800">' + (o.paymentMethod || 'Doorstep') + '</strong></p>' +
              '</div>' +

              '<div class="pt-1">' +
                (!isAssignedToMe ? 
                  '<button onclick="acceptRiderDelivery(\'' + o.orderId + '\')" class="w-full bg-slate-950 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider cursor-pointer shadow-sm transition">⚡ Accept Delivery Task</button>' : 
                  '<div class="grid grid-cols-2 gap-2">' +
                    '<a href="tel:' + o.customerPhone + '" class="bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs text-center flex items-center justify-center gap-1">📞 Call Customer</a>' +
                    '<button onclick="openOtpVerificationModal(\'' + o.orderId + '\', \'' + o.deliveryOtp + '\')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer shadow-md">🔑 Complete via OTP</button>' +
                  '</div>'
                ) +
              '</div>' +
            '</div>';
        });

        pool.innerHTML = html;
      });
    }

    function acceptRiderDelivery(orderId) {
      db.ref("orders/" + orderId).update({
        riderAssigned: true,
        riderName: currentRider.name,
        riderPhone: currentRider.mobile,
        riderVehicle: currentRider.vehicle,
        paymentStatus: "Rider Out for Delivery"
      }).then(function() {
        alert("✓ Delivery Accepted! Pick up package from boutique.");
      });
    }

    // Open OTP Verification Modal
    function openOtpVerificationModal(orderId, expectedOtp) {
      document.getElementById("otpTargetOrderId").value = orderId;
      document.getElementById("otpExpectedCode").value = expectedOtp;
      document.getElementById("enteredCustomerOtp").value = "";
      document.getElementById("otpVerifyModal").classList.remove("hidden");
    }

    function closeOtpModal() {
      document.getElementById("otpVerifyModal").classList.add("hidden");
    }

    // Verify Customer 4-Digit OTP and Complete Delivery
    function verifyAndCompleteDelivery() {
      var targetOrderId = document.getElementById("otpTargetOrderId").value;
      var expectedCode = document.getElementById("otpExpectedCode").value.trim();
      var enteredCode = document.getElementById("enteredCustomerOtp").value.trim();

      if (enteredCode.length !== 4) {
        return alert("Please enter the complete 4-digit OTP!");
      }

      if (enteredCode === expectedCode) {
        db.ref("orders/" + targetOrderId).update({
          status: "Delivered",
          paymentStatus: "Delivered Successfully 🎉",
          deliveredAt: Date.now()
        }).then(function() {
          alert("🎉 OTP Verified! Order Successfully Delivered!");
          closeOtpModal();
        });
      } else {
        alert("❌ Incorrect OTP! Please ask the customer to check their tracking screen.");
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      var saved = localStorage.getItem("fitin60_active_rider");
      if (saved) riderLoginSuccess(JSON.parse(saved));
    });
  </script>
</body>
</html>
