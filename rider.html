<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Rider Fleet Radar</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafaf9; color: #0f172a; }
    .font-brand { font-family: 'Syne', sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 h-16 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <span class="font-brand text-2xl font-black tracking-tight text-slate-950">
        FITIN<span class="text-orange-600">60</span>
      </span>
      <span class="text-[9px] bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full border border-indigo-200">🛵 RIDER FLEET</span>
    </div>
    <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-1.5 rounded-xl text-xs transition">
      🏠 Customer Shop
    </a>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
    <!-- Active Delivery Radar Box -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
      <h2 class="font-brand font-black text-lg text-slate-950 mb-4">🛵 Live 15KM Delivery Radar</h2>
      <div id="riderOrdersList" class="space-y-3">
        <p class="text-xs text-slate-400">Scanning 15KM radar for ready orders...</p>
      </div>
    </div>
  </main>

  <script>
    var firebaseConfig = {
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    db.ref("orders").on("value", function(snapshot) {
      var data = snapshot.val() || {};
      var list = document.getElementById("riderOrdersList");
      var html = "";

      var keys = Object.keys(data);
      if (keys.length === 0) {
        list.innerHTML = "<p class='text-xs text-slate-400'>No delivery orders on radar right now.</p>";
        return;
      }

      keys.forEach(function(key) {
        var order = data[key];
        html += `
          <div class="p-4 bg-slate-50 border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
            <div>
              <p class="font-black text-slate-900">Order ID: ${order.orderId} • Store: ${order.store || 'Boutique'}</p>
              <p class="text-slate-600 mt-0.5">Deliver to: <strong>${order.customerName}</strong> (${order.customerPhone})</p>
              <p class="text-slate-500">Address: ${order.customerAddress}</p>
              <p class="font-mono font-bold text-emerald-600 mt-1">Delivery Fee Earning: ₹${order.deliveryFee || 49} | Status: ${order.riderAssigned ? 'Assigned' : 'Ready for Pickup'}</p>
            </div>
            <div>
              <button onclick="riderClaimOrder('${key}')" class="bg-slate-950 hover:bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl shadow transition cursor-pointer">
                ⚡ Claim & Deliver
              </button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    });

    window.riderClaimOrder = function(orderKey) {
      db.ref("orders/" + orderKey).update({ riderAssigned: true }).then(function() {
        alert("✓ Order claimed successfully! Proceed to boutique store for pickup.");
      });
    };
  </script>
</body>
</html>
