<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Rider Fleet Radar</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-950 text-white px-4 py-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="bg-emerald-600 text-white font-black px-2.5 py-1 rounded-xl text-sm">R60</div>
        <h1 class="font-extrabold text-base tracking-tight">Rider Fleet Radar (15KM Zone)</h1>
      </div>
      <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition">
        🏠 Home / Shop
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
    <!-- Active Delivery Radar Box -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
      <h2 class="font-extrabold text-base text-slate-900 mb-4">🛵 Live Delivery Radar (Ready for Pickup)</h2>
      <div id="riderOrdersList" class="space-y-3">
        <p class="text-xs text-slate-400">Scanning 15KM radar for ready orders...</p>
      </div>
    </div>
  </main>

  <script>
    var firebaseConfig = {
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    db.ref("orders").on("value", function(snapshot) {
      var data = snapshot.val() || {};
      var list = document.getElementById("riderOrdersList");
      var html = "";

      var keys = Object.keys(data);
      if (keys.length === 0) {
        list.innerHTML = "<p class='text-xs text-slate-400'>No orders on radar right now.</p>";
        return;
      }

      keys.forEach(function(key) {
        var order = data[key];
        html += `
          <div class="p-4 bg-slate-50 border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
            <div>
              <p class="font-black text-slate-900">Order ID: ${order.orderId} • Store: ${order.store || 'Boutique'}</p>
              <p class="text-slate-600 mt-0.5">Deliver to: <strong>${order.customerName}</strong> (${order.customerPhone})</p>
              <p class="text-slate-500">Address: ${order.customerAddress}</p>
              <p class="font-mono font-bold text-emerald-600 mt-1">Delivery Fee Earning: ₹${order.deliveryFee || 49} | Status: ${order.riderAssigned ? 'Assigned to Rider' : 'Waiting for Pickup'}</p>
            </div>
            <div>
              <button onclick="claimOrder('${key}')" class="bg-slate-950 hover:bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl shadow transition">
                ⚡ Claim & Deliver
              </button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    });

    window.claimOrder = function(orderKey) {
      db.ref("orders/" + orderKey).update({ riderAssigned: true }).then(function() {
        alert("✓ Order claimed successfully! Proceed to store for pickup.");
      });
    };
  </script>
</body>
</html>
