<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Rider Fleet Station</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 antialiased selection:bg-orange-500 selection:text-white">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-2xl mx-auto px-4 h-20 flex items-center justify-between">
      <div>
        <span class="font-brand text-2xl font-black text-white">FITIN<span class="text-orange-500">60</span></span>
        <span class="text-[10px] block font-bold text-slate-400 uppercase tracking-wider">Rider Fleet Command</span>
      </div>

      <a href="index.html" class="text-xs font-bold text-slate-300 hover:text-white bg-slate-800 px-4 py-2.5 rounded-2xl border border-slate-700 transition">
        ← Customer Store
      </a>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 mt-8 space-y-6">

    <!-- Duty Toggle Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-[2.5rem] p-7 text-center shadow-xl">
      <div class="text-3xl mb-2" id="dutyIcon">🛵</div>
      <h2 class="font-brand font-bold text-xl text-white" id="dutyTitle">Ready for Deliveries?</h2>
      <p class="text-xs text-slate-400 mt-1">Turn ON Duty to receive instant chime notifications for customer orders nearby.</p>

      <button id="dutySwitchBtn" onclick="toggleRiderDuty()" class="mt-6 w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg cursor-pointer flex items-center justify-center gap-2">
        <span id="dutyDot" class="w-3 h-3 rounded-full bg-rose-500"></span>
        <span id="dutyBtnText">⚡ Turn ON Duty (Go Online)</span>
      </button>
    </div>

    <!-- Active Rides Pool -->
    <div class="space-y-4">
      <div class="flex items-center justify-between px-2">
        <h3 class="font-brand font-black text-sm text-slate-300 uppercase tracking-wider">Live Available Rides</h3>
        <span id="rideCountBadge" class="text-xs bg-slate-900 text-orange-400 font-bold px-3 py-1 rounded-xl border border-slate-800">0 Available</span>
      </div>

      <div id="riderFeedContainer" class="space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center text-xs text-slate-400">
          You are Offline. Switch on Duty above to view live dress delivery requests.
        </div>
      </div>
    </div>

  </main>

  <script>
    var isOnline = false;
    var audioCtx = null;
    var knownOrders = {};

    function playDingDong() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        var now = audioCtx.currentTime;
        var osc1 = audioCtx.createOscillator();
        var gain1 = audioCtx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(587.33, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.4);

        var osc2 = audioCtx.createOscillator();
        var gain2 = audioCtx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(880, now + 0.15);
        gain2.gain.setValueAtTime(0.3, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.6);
      } catch(e) {}
    }

    function toggleRiderDuty() {
      isOnline = !isOnline;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      var dot = document.getElementById("dutyDot");
      var text = document.getElementById("dutyBtnText");
      var title = document.getElementById("dutyTitle");
      var btn = document.getElementById("dutySwitchBtn");

      if (isOnline) {
        dot.className = "w-3 h-3 rounded-full bg-emerald-400 animate-pulse";
        text.innerText = "Duty is ONLINE (Listening for Rides)";
        title.innerText = "You are On Duty!";
        btn.className = "mt-6 w-full bg-slate-800 hover:bg-slate-700 text-rose-400 font-black py-4 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg cursor-pointer flex items-center justify-center gap-2 border border-slate-700";
        renderRiderOrders();
      } else {
        dot.className = "w-3 h-3 rounded-full bg-rose-500";
        text.innerText = "⚡ Turn ON Duty (Go Online)";
        title.innerText = "Ready for Deliveries?";
        btn.className = "mt-6 w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg cursor-pointer flex items-center justify-center gap-2";
        document.getElementById("riderFeedContainer").innerHTML = '<div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center text-xs text-slate-400">You are Offline. Switch on Duty above to view live dress delivery requests.</div>';
        document.getElementById("rideCountBadge").innerText = "0 Available";
      }
    }

    function renderRiderOrders() {
      if (!isOnline) return;

      var container = document.getElementById("riderFeedContainer");
      var badge = document.getElementById("rideCountBadge");
      var rawOrder = localStorage.getItem("chitikelo_active_order");

      if (rawOrder) {
        var order = JSON.parse(rawOrder);
        if (order.orderId) {
          if (!knownOrders[order.orderId]) {
            knownOrders[order.orderId] = true;
            playDingDong();
          }

          badge.innerText = "1 Available";
          container.innerHTML = 
            '<div class="bg-slate-900 border border-orange-500/60 rounded-3xl p-6 text-xs space-y-3.5 shadow-xl">' +
              '<div class="flex justify-between items-center font-bold">' +
                '<span class="text-orange-400 font-brand text-sm">⚡ ' + order.orderId + '</span>' +
                '<span class="text-emerald-400 font-black text-base">₹' + order.totalAmount + '</span>' +
              '</div>' +
              '<div class="space-y-1.5 text-slate-300 bg-slate-950 p-4 rounded-2xl border border-slate-800">' +
                '<p><strong>🏬 Pickup Store:</strong> ' + (order.store || "Boutique") + '</p>' +
                '<p><strong>📍 Customer Drop:</strong> ' + (order.customerName || "Customer") + '</p>' +
                '<p class="text-slate-400 text-[11px]">Address: ' + (order.customerAddress || "Anantapur") + '</p>' +
              '</div>' +
              '<div class="grid grid-cols-2 gap-2">' +
                '<a href="tel:' + (order.customerPhone || "") + '" class="bg-slate-800 hover:bg-slate-700 text-center py-3 rounded-xl text-white font-bold transition">📞 Call Customer</a>' +
                '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(order.customerAddress || "Anantapur") + '" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-center py-3 rounded-xl text-white font-bold transition">🗺️ Google Maps</a>' +
              '</div>' +
              '<button onclick="alert(\'✓ Ride Accepted! Head to Boutique for pickup.\')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider cursor-pointer shadow-md">✓ Accept 60-Min Express Ride</button>' +
            '</div>';
          return;
        }
      }

      badge.innerText = "0 Available";
      container.innerHTML = '<div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center text-xs text-emerald-400 font-bold">✓ Online & Listening • Waiting for new customer orders...</div>';
    }

    setInterval(function() {
      if (isOnline) renderRiderOrders();
    }, 3000);
  </script>
</body>
</html>
