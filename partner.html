<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Boutique Merchant Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Syne', sans-serif; }
  </style>
</head>
<body class="bg-[#fafaf9] text-slate-900 min-h-screen pb-24 antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-6 h-20 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <span class="font-brand text-2xl font-black">FITIN<span class="text-orange-600">60</span></span>
      <span class="text-xs bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded-md">MERCHANT STUDIO</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="logoutBtn" onclick="merchantLogout()" class="hidden text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-xl transition cursor-pointer">Logout</button>
      <a href="index.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl">← Customer Radar</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 mt-8 space-y-6">

    <!-- 1. MANDATORY AUTH CARD (Visible if not logged in) -->
    <div id="authSection" class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-xl space-y-6">
      <div class="text-center space-y-1">
        <h2 class="font-brand font-black text-2xl text-slate-950">Boutique Partner Portal</h2>
        <p class="text-xs text-slate-500">Authorized store access only. Login or register to manage your store.</p>
      </div>

      <div class="flex bg-slate-100 p-1 rounded-2xl">
        <button onclick="switchAuthTab('login')" id="tabLogin" class="flex-1 py-2 text-xs font-bold rounded-xl bg-white text-slate-950 shadow-sm transition cursor-pointer">Partner Login</button>
        <button onclick="switchAuthTab('register')" id="tabRegister" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-500 transition cursor-pointer">Register New Boutique</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleMerchantLogin(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Registered Mobile</label>
          <input type="tel" id="loginMobile" required placeholder="10-Digit Mobile" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Secret 4-Digit PIN</label>
          <input type="password" id="loginPin" required maxlength="4" placeholder="**" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500 tracking-widest font-mono">
        </div>
        <button type="submit" class="w-full bg-slate-950 hover:bg-orange-600 text-white font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-md cursor-pointer">
          Login to Private Studio ➔
        </button>
      </form>

      <!-- Registration Form (Auto-Logs in on submit) -->
      <form id="registerForm" onsubmit="handleMerchantRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Boutique / Store Name</label>
          <input type="text" id="regStoreName" required placeholder="e.g., Anu Ram Fashions" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Store Location / Area</label>
          <input type="text" id="regArea" required placeholder="e.g., Subhash Road, Anantapur" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Merchant Mobile Number</label>
          <input type="tel" id="regMobile" required placeholder="10-Digit Mobile" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Set 4-Digit Security PIN</label>
          <input type="password" id="regPin" required maxlength="4" placeholder="**" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500 tracking-widest font-mono">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Store UPI ID</label>
          <input type="text" id="regUpi" required placeholder="e.g., storename@upi" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500 font-mono">
        </div>
        <button type="submit" id="regSubmitBtn" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-md cursor-pointer">
          Complete Registration & Enter Studio ➔
        </button>
      </form>
    </div>

    <!-- 2. PRIVATE DASHBOARD (Visible ONLY when logged in) -->
    <div id="privateDashboard" class="hidden space-y-6">

      <div class="bg-slate-950 text-white p-6 rounded-[2rem] flex items-center justify-between shadow-xl">
        <div class="flex items-center gap-3.5">
          <span class="text-3xl">🏬</span>
          <div>
            <h2 id="dashStoreName" class="font-brand font-black text-xl">Boutique Name</h2>
            <p id="dashStoreMeta" class="text-xs text-slate-400">Area • Mobile: 9876543210</p>
          </div>
        </div>
        <span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-bold">AUTHENTICATED</span>
      </div>

      <!-- Live Incoming Orders with Delete Option -->
      <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b pb-3">
          <h3 class="font-brand font-bold text-base text-slate-950">Live Store Orders</h3>
          <span id="orderCountBadge" class="text-xs bg-orange-100 text-orange-700 font-bold px-2.5 py-0.5 rounded-full">0 Orders</span>
        </div>
        <div id="incomingOrderBox" class="space-y-4"></div>
      </div>

      <!-- Upload New Outfit directly to Firebase -->
      <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
        <h3 class="font-brand font-bold text-base text-slate-950">+ Upload New Dress to Radar</h3>
        <form onsubmit="handleUploadProduct(event)" class="space-y-3.5">
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Dress / Outfit Name</label>
            <input type="text" id="prodName" required placeholder="e.g., Designer Anarkali Kurta" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Price (₹)</label>
              <input type="number" id="prodPrice" required placeholder="899" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
            </div>
            <div>
              <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Original Price (₹)</label>
              <input type="number" id="prodOriginal" required placeholder="1499" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Image URL</label>
            <input type="url" id="prodImg" required placeholder="https://images.unsplash.com/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Available Sizes</label>
            <input type="text" id="prodSizes" required placeholder="S, M, L, XL" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Description</label>
            <textarea id="prodDesc" rows="2" required placeholder="Pure cotton fabric..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs"></textarea>
          </div>
          <button type="submit" id="uploadSubmitBtn" class="w-full bg-slate-950 hover:bg-orange-600 text-white font-black py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-md cursor-pointer">
            + Publish Live to Fitin60
          </button>
        </form>
      </div>

      <!-- Manage & Delete Uploaded Outfits -->
      <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
        <h3 class="font-brand font-bold text-base text-slate-950">Manage Uploaded Outfits</h3>
        <div id="storeProductsList" class="space-y-3"></div>
      </div>

    </div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var currentMerchant = null;

    function switchAuthTab(tab) {
      var loginF = document.getElementById("loginForm");
      var regF = document.getElementById("registerForm");
      var tLog = document.getElementById("tabLogin");
      var tReg = document.getElementById("tabRegister");

      if (tab === 'login') {
        loginF.classList.remove("hidden");
        regF.classList.add("hidden");
        tLog.classList.add("bg-white", "text-slate-950", "shadow-sm");
        tLog.classList.remove("text-slate-500");
        tReg.classList.remove("bg-white", "text-slate-950", "shadow-sm");
        tReg.classList.add("text-slate-500");
      } else {
        loginF.classList.add("hidden");
        regF.classList.remove("hidden");
        tReg.classList.add("bg-white", "text-slate-950", "shadow-sm");
        tReg.classList.remove("text-slate-500");
        tLog.classList.remove("bg-white", "text-slate-950", "shadow-sm");
        tLog.classList.add("text-slate-500");
      }
    }

    // REGISTRATION WITH IMMEDIATE AUTO-LOGIN
    function handleMerchantRegister(e) {
      e.preventDefault();
      var storeName = document.getElementById("regStoreName").value.trim();
      var area = document.getElementById("regArea").value.trim();
      var mobile = document.getElementById("regMobile").value.trim();
      var pin = document.getElementById("regPin").value.trim();
      var upi = document.getElementById("regUpi").value.trim();

      var btn = document.getElementById("regSubmitBtn");
      btn.disabled = true;
      btn.innerText = "Creating Studio...";

      var newPartner = { storeName: storeName, area: area, mobile: mobile, pin: pin, upi: upi };

      db.ref("partners/" + mobile).set(newPartner).then(function() {
        alert("✓ Registration Successful! Auto-logging in to your studio...");
        loginSuccess(newPartner);
      }).catch(function(err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.innerText = "Complete Registration & Enter Studio ➔";
      });
    }

    function handleMerchantLogin(e) {
      e.preventDefault();
      var mobile = document.getElementById("loginMobile").value.trim();
      var pin = document.getElementById("loginPin").value.trim();

      db.ref("partners/" + mobile).once("value").then(function(snapshot) {
        var partner = snapshot.val();
        if (partner && partner.pin === pin) {
          loginSuccess(partner);
        } else {
          alert("Invalid Mobile or PIN! Please register first if you are new.");
        }
      });
    }

    function loginSuccess(partner) {
      currentMerchant = partner;
      localStorage.setItem("fitin60_active_merchant", JSON.stringify(partner));

      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("privateDashboard").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");

      document.getElementById("dashStoreName").innerText = partner.storeName;
      document.getElementById("dashStoreMeta").innerText = "📍 " + partner.area + " • Mobile: " + partner.mobile;

      listenToStoreOrders();
      listenToStoreProducts();
    }

    function merchantLogout() {
      currentMerchant = null;
      localStorage.removeItem("fitin60_active_merchant");
      document.getElementById("authSection").classList.remove("hidden");
      document.getElementById("privateDashboard").classList.add("hidden");
      document.getElementById("logoutBtn").classList.add("hidden");
    }

    function handleUploadProduct(e) {
      e.preventDefault();
      if (!currentMerchant) return;

      var name = document.getElementById("prodName").value.trim();
      var price = parseInt(document.getElementById("prodPrice").value.trim(), 10);
      var orig = parseInt(document.getElementById("prodOriginal").value.trim(), 10);
      var img = document.getElementById("prodImg").value.trim();
      var sizes = document.getElementById("prodSizes").value.split(",").map(function(s) { return s.trim(); });
      var desc = document.getElementById("prodDesc").value.trim();
      var prodId = "PROD-" + Date.now();

      var newProd = {
        id: prodId,
        name: name,
        store: currentMerchant.storeName,
        area: currentMerchant.area,
        price: price,
        originalPrice: orig,
        discount: Math.round(((orig - price) / orig) * 100) + "% OFF",
        image: img,
        sizes: sizes,
        desc: desc,
        eta: "35 MINS",
        rating: "5.0"
      };

      var btn = document.getElementById("uploadSubmitBtn");
      btn.disabled = true;
      btn.innerText = "Publishing...";

      db.ref("boutique_products/" + prodId).set(newProd).then(function() {
        alert("✓ Published to Live Store!");
        btn.disabled = false;
        btn.innerText = "+ Publish Live to Fitin60";
        e.target.reset();
      });
    }

    function listenToStoreOrders() {
      if (!currentMerchant) return;

      db.ref("orders").orderByChild("store").equalTo(currentMerchant.storeName).on("value", function(snapshot) {
        var box = document.getElementById("incomingOrderBox");
        var badge = document.getElementById("orderCountBadge");
        var orders = snapshot.val();

        if (!orders) {
          badge.innerText = "0 Orders";
          box.innerHTML = "<p class='text-center text-slate-400 text-xs py-4'>No orders pending right now.</p>";
          return;
        }

        var list = Object.values(orders).reverse();
        badge.innerText = list.length + " Orders";

        var html = "";
        list.forEach(function(order) {
          var firstItem = order.items && order.items[0] ? order.items[0] : { name: "Outfit" };
          html += 
            '<div class="p-4 bg-orange-50/60 border border-orange-200 rounded-2xl space-y-2.5">' +
              '<div class="flex justify-between items-center">' +
                '<span class="font-mono font-black text-sm text-slate-950">' + order.orderId + '</span>' +
                '<div class="flex items-center gap-2">' +
                  '<span class="text-[10px] font-bold ' + (order.boutiqueAccepted ? 'text-emerald-700 bg-emerald-100' : 'text-orange-700 bg-orange-100') + ' px-2 py-0.5 rounded">' +
                    (order.boutiqueAccepted ? "Dispatched" : "Pending") +
                  '</span>' +
                  '<button onclick="deleteCloudOrder(\'' + order.orderId + '\')" title="Delete Order" class="text-rose-600 hover:bg-rose-100 p-1 rounded font-bold text-xs cursor-pointer">🗑️</button>' +
                '</div>' +
              '</div>' +
              '<p class="text-xs text-slate-700"><strong>Outfit:</strong> ' + firstItem.name + ' • <strong>Customer:</strong> ' + order.customerName + ' (' + order.customerPhone + ')</p>' +
              '<p class="text-xs text-slate-600"><strong>Address:</strong> ' + order.customerAddress + '</p>' +
              '<div class="flex justify-between items-center pt-1">' +
                '<span class="font-mono font-black text-sm">₹' + order.totalAmount + '</span>' +
                (!order.boutiqueAccepted ? 
                  '<button onclick="acceptCloudOrder(\'' + order.orderId + '\')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs uppercase cursor-pointer">✓ Accept & Send Rider</button>' : 
                  '<span class="text-xs text-emerald-700 font-bold">✓ Accepted</span>') +
              '</div>' +
            '</div>';
        });

        box.innerHTML = html;
      });
    }

    function acceptCloudOrder(orderId) {
      db.ref("orders/" + orderId).update({
        boutiqueAccepted: true,
        paymentStatus: "Accepted by Boutique • Alert Sent to Rider 🛵"
      });
    }

    function deleteCloudOrder(orderId) {
      if (confirm("Are you sure you want to delete order (" + orderId + ")?")) {
        db.ref("orders/" + orderId).remove().then(function() {
          alert("Order deleted.");
        });
      }
    }

    function listenToStoreProducts() {
      if (!currentMerchant) return;

      db.ref("boutique_products").orderByChild("store").equalTo(currentMerchant.storeName).on("value", function(snapshot) {
        var list = document.getElementById("storeProductsList");
        var prods = snapshot.val();

        if (!prods) {
          list.innerHTML = "<p class='text-xs text-slate-400 py-3'>No custom outfits uploaded yet.</p>";
          return;
        }

        var html = "";
        Object.keys(prods).forEach(function(key) {
          var p = prods[key];
          html += 
            '<div class="flex items-center justify-between p-3 bg-slate-50 border rounded-2xl text-xs">' +
              '<div class="flex items-center gap-3">' +
                '<img src="' + p.image + '" class="w-10 h-10 object-cover rounded-lg">' +
                '<div>' +
                  '<p class="font-bold text-slate-900">' + p.name + '</p>' +
                  '<p class="text-slate-500 font-mono">₹' + p.price + '</p>' +
                '</div>' +
              '</div>' +
              '<button onclick="deleteCloudProduct(\'' + key + '\')" class="text-rose-600 hover:bg-rose-100 p-2 rounded-xl text-xs font-bold cursor-pointer">' +
                '🗑️ Delete' +
              '</button>' +
            '</div>';
        });

        list.innerHTML = html;
      });
    }

    function deleteCloudProduct(key) {
      if (confirm("Are you sure you want to delete this dress?")) {
        db.ref("boutique_products/" + key).remove().then(function() {
          alert("Dress removed!");
        });
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      var saved = localStorage.getItem("fitin60_active_merchant");
      if (saved) {
        loginSuccess(JSON.parse(saved));
      }
    });
  </script>
</body>
</html>
