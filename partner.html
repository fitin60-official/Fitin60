<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Boutique Merchant Studio & Order Dispatch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Syne', sans-serif; }
  </style>
</head>
<body class="bg-[#fafaf9] text-slate-900 min-h-screen pb-20">

  <header class="bg-white border-b border-slate-200 px-6 h-20 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="font-brand text-2xl font-black">FITIN<span class="text-orange-600">60</span></span>
      <span class="text-xs bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded-md">MERCHANT STUDIO</span>
    </div>
    <a href="index.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl">← Customer Radar</a>
  </header>

  <main class="max-w-3xl mx-auto px-4 mt-8 space-y-6">

    <!-- Store Profile Card -->
    <div class="bg-slate-950 text-white p-6 rounded-3xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🏬</span>
        <div>
          <h2 class="font-brand font-black text-xl">Anu Ram Fashions</h2>
          <p class="text-xs text-slate-400">Subhash Road, Anantapur • Express Dispatch Center</p>
        </div>
      </div>
      <span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-bold">LIVE ONLINE</span>
    </div>

    <!-- Active Orders Management Section -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="font-brand font-bold text-base text-slate-950">Incoming Customer Orders</h3>
        <span class="text-xs bg-orange-100 text-orange-700 font-bold px-2.5 py-0.5 rounded-full" id="orderCountBadge">Checking...</span>
      </div>

      <div id="incomingOrderBox">
        <p class="text-center text-slate-400 text-xs py-8">Waiting for customer orders...</p>
      </div>
    </div>

  </main>

  <script>
    function checkIncomingOrders() {
      var rawOrder = localStorage.getItem("chitikelo_active_order");
      var box = document.getElementById("incomingOrderBox");
      var badge = document.getElementById("orderCountBadge");

      if (!rawOrder) {
        badge.innerText = "0 Orders";
        box.innerHTML = "<p class='text-center text-slate-400 text-xs py-8'>No pending orders right now.</p>";
        return;
      }

      var order = JSON.parse(rawOrder);
      var firstItem = order.items && order.items[0] ? order.items[0] : { name: "Designer Dress" };

      badge.innerText = order.boutiqueAccepted ? "Dispatched" : "1 New Order!";

      var waBoutiqueNotify = "⚡ BOUTIQUE ORDER ACCEPTED ⚡\n\n" +
                             "Order: " + order.orderId + "\n" +
                             "Item: " + firstItem.name + "\n" +
                             "Customer: " + order.customerName + " (" + order.customerPhone + ")\n" +
                             "Status: Packed & Ready for Rider Pickup!";

      var waUrl = "https://wa.me/?text=" + encodeURIComponent(waBoutiqueNotify);

      box.innerHTML = 
        '<div class="p-5 bg-orange-50/50 border border-orange-200 rounded-2xl space-y-3">' +
          '<div class="flex justify-between items-center">' +
            '<span class="font-mono font-black text-slate-950 text-sm">' + order.orderId + '</span>' +
            '<span class="text-xs font-bold ' + (order.boutiqueAccepted ? 'text-emerald-700 bg-emerald-100' : 'text-orange-700 bg-orange-100') + ' px-2.5 py-0.5 rounded-lg">' +
              (order.boutiqueAccepted ? "✓ Accepted & Alert Sent to Rider" : "⏳ Action Required") +
            '</span>' +
          '</div>' +

          '<div class="text-xs text-slate-700 space-y-1">' +
            '<p><strong>Outfit:</strong> ' + firstItem.name + '</p>' +
            '<p><strong>Customer:</strong> ' + order.customerName + ' (' + order.customerPhone + ')</p>' +
            '<p><strong>Address:</strong> ' + order.customerAddress + '</p>' +
            '<p><strong>Total Amount:</strong> ₹' + order.totalAmount + '</p>' +
          '</div>' +

          '<div class="pt-2 flex gap-3">' +
            (!order.boutiqueAccepted ? 
              '<button onclick="acceptOrderByBoutique()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">' +
                '✓ Accept & Dispatch to Rider' +
              '</button>' : 
              '<a href="' + waUrl + '" target="_blank" class="flex-1 bg-[#25D366] text-white font-bold py-3 rounded-xl text-xs uppercase text-center block">' +
                '📲 Send WhatsApp Confirmation' +
              '</a>'
            ) +
          '</div>' +
        '</div>';
    }

    function acceptOrderByBoutique() {
      var rawOrder = localStorage.getItem("chitikelo_active_order");
      if (!rawOrder) return;
      var order = JSON.parse(rawOrder);
      order.boutiqueAccepted = true;
      order.paymentStatus = "Accepted by Boutique • Rider Alerted";
      localStorage.setItem("chitikelo_active_order", JSON.stringify(order));
      checkIncomingOrders();
      alert("✓ Order accepted! Active riders have been alerted to pick up.");
    }

    setInterval(checkIncomingOrders, 2000);
    window.addEventListener('DOMContentLoaded', checkIncomingOrders);
  </script>
</body>
</html>
