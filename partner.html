<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Boutique Merchant Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#fafaf9] text-slate-900 min-h-screen antialiased selection:bg-orange-500 selection:text-white pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-slate-200/80 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col">
        <span class="font-brand text-2xl md:text-3xl font-black tracking-tight text-slate-950">
          FITIN<span class="text-orange-600">60</span>
        </span>
        <span class="text-[9px] uppercase tracking-[0.3em] font-extrabold text-slate-400">Partner Merchant Studio</span>
      </a>
      <a href="index.html" class="text-xs font-bold text-slate-700 hover:text-orange-600 bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-2xl transition">
        ← Customer Store
      </a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 sm:px-6 mt-10">
    <div class="bg-white rounded-[2.5rem] border border-slate-200 p-8 md:p-10 shadow-xl">
      <div class="w-14 h-14 rounded-2xl bg-orange-600/10 text-orange-600 flex items-center justify-center text-2xl font-bold mb-4">🏬</div>
      <h1 class="font-brand text-2xl md:text-3xl font-black text-slate-950">Partner Onboarding Hub</h1>
      <p class="text-xs text-slate-500 mt-1">List your boutique collections on Fitin60 to receive direct instant UPI orders from customers within a 20-KM radius.</p>

      <form onsubmit="handlePartnerSubmit(event)" class="mt-8 space-y-4">
        <div>
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 mb-1.5">Boutique / Store Name</label>
          <input type="text" id="partnerStoreName" required placeholder="e.g., Anu Ram Designer Studio" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 mb-1.5">Store Address / Area</label>
          <input type="text" id="partnerArea" required placeholder="e.g., Subhash Road, Anantapur" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 mb-1.5">Store Direct Merchant UPI ID (Instant Payout)</label>
          <input type="text" id="partnerUpi" required placeholder="e.g., storename@okhdfcbank / mobile@ybl" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-[11px] font-black uppercase tracking-wider text-slate-600 mb-1.5">Owner Contact Number</label>
          <input type="tel" id="partnerPhone" required placeholder="10-Digit Mobile Number" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-xs focus:outline-none focus:border-orange-500">
        </div>

        <button type="submit" class="w-full bg-slate-950 hover:bg-orange-600 text-white font-black py-4 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg mt-6 cursor-pointer">
          ⚡ Register Boutique on Fitin60 Radar
        </button>
      </form>
    </div>
  </main>

  <script>
    function handlePartnerSubmit(e) {
      e.preventDefault();
      var store = document.getElementById("partnerStoreName").value.trim();
      var upi = document.getElementById("partnerUpi").value.trim();
      alert("✅ Store \"" + store + "\" with UPI (" + upi + ") successfully submitted to Fitin60!");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
