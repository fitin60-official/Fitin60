<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner With CHITIKELO | 60-Minute Hyperlocal Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col">
        <span class="font-brand text-2xl md:text-3xl font-black tracking-tight text-slate-950">
          CHITI<span class="text-orange-600">KELO</span>
        </span>
        <span class="text-[9px] uppercase tracking-[0.25em] font-extrabold text-slate-400">Hyperlocal Fashion</span>
      </a>
      <a href="index.html" class="text-xs font-bold text-slate-700 hover:text-orange-600 px-4 py-2 rounded-xl border border-slate-200">
        ← Back to Shop
      </a>
    </div>
  </header>

  <!-- Main Hero & Form Section -->
  <main class="max-w-4xl mx-auto px-4 py-12">
    
    <div class="text-center max-w-xl mx-auto mb-10">
      <span class="bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Partner Network</span>
      <h1 class="font-brand text-3xl md:text-4xl font-black text-slate-950 mt-3">Grow Your Fashion Store with 60-Minute Deliveries</h1>
      <p class="text-slate-500 text-sm mt-2">Join Chitikelo and start receiving express orders directly on WhatsApp from local buyers within 30km.</p>
    </div>

    <!-- Onboarding Form Card -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 md:p-10 shadow-sm">
      <h2 class="font-brand text-xl font-bold text-slate-950 mb-6">Register Your Boutique / Store</h2>

      <form id="partnerForm" onsubmit="submitPartnerForm(event)" class="space-y-5">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Store / Boutique Name</label>
          <input type="text" id="storeName" required placeholder="e.g. Anu Ram Fashions, Sai Menswear" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Owner Name</label>
            <input type="text" id="ownerName" required placeholder="Your Name" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">WhatsApp Phone Number</label>
            <input type="tel" id="storePhone" required placeholder="e.g. 9876543210" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Store Location / City Area</label>
          <input type="text" id="storeAddress" required placeholder="e.g. KPHB, Hyderabad / Main Road, Vizag" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Fashion Categories You Sell</label>
          <select id="storeCategory" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">
            <option value="Women's Ethnic & Designer Wear">Women's Ethnic & Designer Wear</option>
            <option value="Men's Formal & Casual Wear">Men's Formal & Casual Wear</option>
            <option value="Kid's Fashion & Accessories">Kid's Fashion & Accessories</option>
            <option value="Multi-Category Boutique">Multi-Category Boutique</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-4 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2 cursor-pointer mt-4">
          <span>💬</span> Submit Partner Request via WhatsApp
        </button>

      </form>
    </div>

  </main>

  <script>
    var ADMIN_WHATSAPP = "919876543210"; // Enter your admin WhatsApp number here

    function submitPartnerForm(e) {
      e.preventDefault();
      
      var storeName = document.getElementById("storeName").value;
      var ownerName = document.getElementById("ownerName").value;
      var storePhone = document.getElementById("storePhone").value;
      var storeAddress = document.getElementById("storeAddress").value;
      var storeCategory = document.getElementById("storeCategory").value;

      var text = "🏪 NEW PARTNER STORE REGISTRATION - CHITIKELO%0A%0A" +
                 "Store Name: " + storeName + "%0A" +
                 "Owner Name: " + ownerName + "%0A" +
                 "Contact: " + storePhone + "%0A" +
                 "Location: " + storeAddress + "%0A" +
                 "Category: " + storeCategory + "%0A%0A" +
                 "Please approve my store onboard request!";

      window.open("https://wa.me/" + ADMIN_WHATSAPP + "?text=" + text, "_blank");
    }
  </script>
</body>
</html>
