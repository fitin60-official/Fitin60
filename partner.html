<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Partner Hub</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafaf9; color: #0f172a; }
    .font-brand { font-family: 'Syne', sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 h-16 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <span class="font-brand text-2xl font-black tracking-tight text-slate-950">
        FITIN<span class="text-orange-600">60</span>
      </span>
      <span class="text-[9px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-full border border-emerald-200">💼 PARTNER HUB</span>
    </div>
    <a href="index.html" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-1.5 rounded-xl text-xs transition">
      🏠 Customer Shop
    </a>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
    <!-- Add Product / Inventory Box -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
      <h2 class="font-brand font-black text-lg text-slate-950 mb-4">➕ Add Boutique Outfit / Uniform</h2>
      <form onsubmit="handlePartnerAddProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
        <div>
          <label class="block font-bold text-slate-400 uppercase mb-1">Store Name</label>
          <input type="text" id="partnerStoreName" required placeholder="e.g., Sai Fashions" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-900">
        </div>
        <div>
          <label class="block font-bold text-slate-400 uppercase mb-1">Store Area / Location</label>
          <input type="text" id="partnerStoreArea" required placeholder="e.g., Kamalanagar, Anantapur" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-900">
        </div>
        <div>
          <label class="block font-bold text-slate-400 uppercase mb-1">Outfit / Uniform Name</label>
          <input type="text" id="partnerProdName" required placeholder="e.g., Designer Kurti Set" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-900">
        </div>
        <div>
          <label class="block font-bold text-slate-400 uppercase mb-1">Category</label>
          <select id="partnerProdCategory" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-900">
            <option value="Uniform">🎒 School Uniform</option>
            <option value="Kids">🧸 Kids Wear</option>
            <option value="Saree">🥻 Saree</option>
            <option value="Kurti">👗 Kurti</option>
            <option value="Lehenga">✨ Lehenga</option>
            <option value="Men">👔 Men's Wear</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-400 uppercase mb-1">Price (₹)</label>
          <input type="number" id="partnerProdPrice" required placeholder="899" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-mono text-slate-900">
        </div>
        <div>
          <label class="block font-bold text-slate-400 uppercase mb-1">Image URL</label>
          <input type="url" id="partnerProdImage" required placeholder="https://images.unsplash.com/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-900">
        </div>
        <div class="sm:col-span-2">
          <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider transition shadow cursor-pointer">
            🚀 Publish Outfit to Live Customer Radar
          </button>
        </div>
      </form>
    </div>

    <!-- Incoming Orders Section -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
      <h2 class="font-brand font-black text-lg text-slate-950 mb-4">📦 Incoming Store Orders</h2>
      <div id="partnerOrdersList" class="space-y-3">
        <p class="text-xs text-slate-400">Loading incoming store orders...</p>
      </div>
    </div>
  </main>

  <script>
    var firebaseConfig = {
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    function handlePartnerAddProduct(e) {
      e.preventDefault();
      var prodData = {
        store: document.getElementById("partnerStoreName").value.trim(),
        area: document.getElementById("partnerStoreArea").value.trim(),
        name: document.getElementById("partnerProdName").value.trim(),
        category: document.getElementById("partnerProdCategory").value,
        price: parseInt(document.getElementById("partnerProdPrice").value),
        image: document.getElementById("partnerProdImage").value.trim(),
        timestamp: Date.now()
      };

      db.ref("boutique_products").push(prodData).then(function() {
        alert("✓ Product published successfully to Customer Radar!");
        e.target.reset();
      }).catch(function(err) {
        alert("Error: " + err.message);
      });
    }

    db.ref("orders").on("value", function(snapshot) {
      var data = snapshot.val() || {};
      var list = document.getElementById("partnerOrdersList");
      var html = "";

      var keys = Object.keys(data);
      if (keys.length === 0) {
        list.innerHTML = "<p class='text-xs text-slate-400'>No store orders received yet.</p>";
        return;
      }

      keys.forEach(function(key) {
        var order = data[key];
        html += `
          <div class="p-4 bg-slate-50 border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
            <div>
              <p class="font-black text-slate-900">Order ID: ${order.orderId} • Store: ${order.store || 'Boutique'}</p>
              <p class="text-slate-600 mt-0.5">Customer: <strong>${order.customerName}</strong> (${order.customerPhone})</p>
              <p class="text-slate-500">Address: ${order.customerAddress}</p>
              <p class="font-mono font-bold text-orange-600 mt-1">Total: ₹${order.totalAmount} | Status: ${order.paymentStatus}</p>
            </div>
            <div>
              <button onclick="partnerAcceptOrder('${key}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl shadow transition cursor-pointer">
                ✓ Accept & Pack (Ready)
              </button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    });

    window.partnerAcceptOrder = function(orderKey) {
      db.ref("orders/" + orderKey).update({ boutiqueAccepted: true }).then(function() {
        alert("✓ Order accepted! Marked ready for delivery rider.");
      });
    };
  </script>
</body>
</html>
