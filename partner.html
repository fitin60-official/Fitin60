<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fitin60 | Partner Hub</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fafaf9; color: #0f172a; }
    .font-brand { font-family: 'Syne', sans-serif; }
    #quickToast { transform: translateY(100px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; }
    #quickToast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body class="min-h-screen pb-28 antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 h-16 flex items-center justify-between shadow-sm">
    <a href="index.html" class="flex items-center gap-1">
      <span class="font-brand text-2xl font-black text-slate-950">FITIN<span class="text-orange-600">60</span></span>
      <span class="text-[9px] bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded-full">Partner Hub</span>
    </a>
    <div id="ownerStatusBadge" class="hidden text-[10px] bg-emerald-100 text-emerald-800 border border-emerald-300 font-black px-2.5 py-1 rounded-xl">
      🛡️ Master Owner Active
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-6 space-y-6">
    <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <div>
          <h1 class="font-brand font-black text-lg text-slate-950">Add New Outfit / Uniform</h1>
          <p class="text-xs text-slate-500">Publish stock instantly for 60-min express delivery.</p>
        </div>
        <span class="text-xl">💼</span>
      </div>

      <form onsubmit="handlePartnerSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">Store / Boutique Name</label>
          <input type="text" id="partStore" required placeholder="e.g. Sai Fashions" class="w-full bg-slate-50 border rounded-xl p-3 font-bold focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Store Area / Location</label>
          <input type="text" id="partArea" required placeholder="e.g. Subhash Road, Anantapur" class="w-full bg-slate-50 border rounded-xl p-3 focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Outfit / Uniform Title</label>
          <input type="text" id="partName" required placeholder="e.g. School Uniform Set / Designer Kurti" class="w-full bg-slate-50 border rounded-xl p-3 focus:outline-none focus:border-orange-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">Price (₹)</label>
            <input type="number" id="partPrice" required placeholder="699" class="w-full bg-slate-50 border rounded-xl p-3 font-mono focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">Category</label>
            <select id="partCategory" class="w-full bg-slate-50 border rounded-xl p-3 font-bold focus:outline-none focus:border-orange-500">
              <option value="Uniform">🎒 School Uniform</option>
              <option value="Kids">🧸 Kids Wear</option>
              <option value="Saree">🥻 Saree</option>
              <option value="Kurti">👗 Kurti</option>
              <option value="Lehenga">✨ Lehenga</option>
              <option value="Men">👔 Men's Wear</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Available Sizes</label>
          <input type="text" id="partSizes" placeholder="28, 30, 32 or M, L, XL" class="w-full bg-slate-50 border rounded-xl p-3 focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">Image Link (URL)</label>
          <input type="url" id="partImage" required placeholder="https://images.unsplash.com/..." class="w-full bg-slate-50 border rounded-xl p-3 font-mono text-xs focus:outline-none focus:border-orange-500">
        </div>

        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-3.5 rounded-xl text-xs uppercase tracking-wider transition cursor-pointer shadow">
          🚀 Publish to 15KM Radar
        </button>
      </form>
    </div>

    <!-- Master Owner Store Management -->
    <div id="masterStoreControlSection" class="hidden bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h2 class="font-brand font-black text-base text-slate-950">🛡️ Master Store Control</h2>
        <span class="text-[10px] bg-rose-100 text-rose-700 font-bold px-2 py-0.5 rounded">Owner Only</span>
      </div>
      <p class="text-xs text-slate-500">Remove any partner store and its items completely from the platform:</p>
      <div id="masterStoresList" class="space-y-2"></div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 py-2.5 px-6 flex items-center justify-around z-40 shadow-lg">
    <a href="index.html" class="flex flex-col items-center text-slate-600 hover:text-orange-600 font-bold">
      <span class="text-lg leading-none">🏬</span>
      <span class="text-[10px] mt-1">Explore</span>
    </a>
    <a href="partner.html" class="flex flex-col items-center text-orange-600 font-bold">
      <span class="text-lg leading-none">💼</span>
      <span class="text-[10px] mt-1">Partner Hub</span>
    </a>
    <a href="rider.html" class="flex flex-col items-center text-slate-600 hover:text-emerald-600 font-bold">
      <span class="text-lg leading-none">🛵</span>
      <span class="text-[10px] mt-1">Rider Fleet</span>
    </a>
    <a href="tracking.html" class="flex flex-col items-center text-slate-600 hover:text-orange-600 font-bold">
      <span class="text-lg leading-none">⚡</span>
      <span class="text-[10px] mt-1">Orders</span>
    </a>
  </nav>

  <!-- Toast Notification -->
  <div id="quickToast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 bg-slate-950/90 backdrop-blur-md text-white text-xs font-bold px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 border border-slate-800 pointer-events-none">
    <span class="text-emerald-400">✓</span>
    <span id="toastMsg">Success</span>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    var isOwnerActive = (localStorage.getItem("fitin60_owner_session") === "active");
    if (isOwnerActive) {
      document.getElementById("ownerStatusBadge").classList.remove("hidden");
      document.getElementById("masterStoreControlSection").classList.remove("hidden");
    }

    function showQuickToast(msg) {
      var toast = document.getElementById("quickToast");
      var text = document.getElementById("toastMsg");
      text.innerText = msg;
      toast.classList.add("show");
      setTimeout(function() { toast.classList.remove("show"); }, 1500);
    }

    window.handlePartnerSubmit = function(e) {
      e.preventDefault();
      var store = document.getElementById("partStore").value.trim();
      var area = document.getElementById("partArea").value.trim();
      var name = document.getElementById("partName").value.trim();
      var price = parseInt(document.getElementById("partPrice").value);
      var category = document.getElementById("partCategory").value;
      var sizesStr = document.getElementById("partSizes").value.trim();
      var image = document.getElementById("partImage").value.trim();

      var sizes = sizesStr ? sizesStr.split(",").map(function(s) { return s.trim(); }) : ["Free size"];

      var prodKey = db.ref("boutique_products").push().key;
      var prodData = {
        store: store,
        area: area,
        name: name,
        price: price,
        originalPrice: Math.round(price * 1.4),
        category: category,
        sizes: sizes,
        image: image,
        images: [image],
        eta: "30 MINS",
        rating: "5.0",
        timestamp: Date.now()
      };

      db.ref("boutique_products/" + prodKey).set(prodData).then(function() {
        db.ref("boutiques/" + store.replace(/[^a-zA-Z0-9]/g, "_")).set({
          storeName: store,
          area: area
        });
        showQuickToast("✓ Published Live!");
        e.target.reset();
      });
    };

    if (isOwnerActive) {
      db.ref("boutique_products").on("value", function(snapshot) {
        var data = snapshot.val() || {};
        var storesMap = {};
        Object.keys(data).forEach(function(k) {
          var p = data[k];
          if (p && p.store) {
            if (!storesMap[p.store]) storesMap[p.store] = 0;
            storesMap[p.store]++;
          }
        });

        var container = document.getElementById("masterStoresList");
        var html = "";
        var storeNames = Object.keys(storesMap);

        if (storeNames.length === 0) {
          container.innerHTML = "<p class='text-xs text-slate-400'>No active stores.</p>";
          return;
        }

        storeNames.forEach(function(s) {
          html += 
            '<div class="flex items-center justify-between p-3 bg-slate-50 border rounded-xl text-xs">' +
              '<div>' +
                '<p class="font-bold text-slate-950">' + s + '</p>' +
                '<p class="text-[10px] text-slate-500">' + storesMap[s] + ' outfits listed</p>' +
              '</div>' +
              '<button onclick="removeStore(\'' + s + '\')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs cursor-pointer">' +
                '🗑️ Remove' +
              '</button>' +
            '</div>';
        });
        container.innerHTML = html;
      });
    }

    window.removeStore = function(storeName) {
      if (confirm("Remove store '" + storeName + "' and all its items?")) {
        db.ref("boutique_products").once("value").then(function(snap) {
          var prods = snap.val() || {};
          var updates = {};
          Object.keys(prods).forEach(function(k) {
            if (prods[k].store && prods[k].store.toLowerCase() === storeName.toLowerCase()) {
              updates[k] = null;
            }
          });
          db.ref("boutique_products").update(updates).then(function() {
            db.ref("boutiques/" + storeName.replace(/[^a-zA-Z0-9]/g, "_")).remove();
            showQuickToast("✓ Store removed");
          });
        });
      }
    };
  </script>
</body>
</html>
