<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Store Hub | CHITIKELO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen pb-16">

  <!-- Navigation Bar -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-20 flex items-center justify-between">
      <a href="index.html" class="flex flex-col">
        <span class="font-brand text-2xl font-black tracking-tight text-slate-950">
          CHITI<span class="text-orange-600">KELO</span>
        </span>
        <span class="text-[9px] uppercase tracking-[0.25em] font-extrabold text-slate-400">Partner Merchant Studio</span>
      </a>
      <a href="index.html" class="text-xs font-bold text-slate-700 hover:text-orange-600 px-4 py-2 rounded-xl border border-slate-200">
        ← Back to Shop
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto px-4 py-10">
    
    <div class="text-center mb-8">
      <span class="bg-orange-100 text-orange-700 text-xs font-bold px-3.5 py-1 rounded-full uppercase tracking-wider">Store Product Listing</span>
      <h1 class="font-brand text-2xl md:text-3xl font-black text-slate-950 mt-2">Upload Clothing & Details</h1>
      <p class="text-slate-500 text-xs mt-1">Select your boutique dress photo and enter prices for instant hyperlocal listing.</p>
    </div>

    <!-- Product Upload Form Card -->
    <div class="bg-white rounded-3xl border border-slate-200 p-6 md:p-8 shadow-sm">
      <form id="uploadForm" onsubmit="handleProductUpload(event)" class="space-y-5">
        
        <!-- Store Info -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Store / Boutique Name</label>
            <input type="text" id="partnerStoreName" required placeholder="e.g. Anu Ram Fashions, Sai Menswear" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Store City & Area</label>
            <input type="text" id="partnerLocation" required placeholder="e.g. KPHB 3rd Phase, Hyderabad" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
          </div>
        </div>

        <!-- Dress Name -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Dress / Item Name</label>
          <input type="text" id="dressName" required placeholder="e.g. Embroidered Anarkali Kurta Set / Cotton Shirt" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
        </div>

        <!-- Category & Sizes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Category</label>
            <select id="dressCategory" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
              <option value="Women's Ethnic & Sarees">Women's Ethnic & Sarees</option>
              <option value="Women's Western & Kurtis">Women's Western & Kurtis</option>
              <option value="Men's Formal & Casual Wear">Men's Formal & Casual Wear</option>
              <option value="Kids Festive Wear">Kids Festive Wear</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Available Sizes</label>
            <input type="text" id="dressSizes" required placeholder="e.g. M, L, XL, XXL, Free Size" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
          </div>
        </div>

        <!-- Pricing & Prep Time -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Offer Price (₹)</label>
            <input type="number" id="dressPrice" required placeholder="e.g. 899" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Preparation / Dispatch ETA</label>
            <select id="dispatchTime" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:border-orange-500">
              <option value="Ready in 10 Mins (Express Dispatch)">Ready in 10 Mins (Express Dispatch)</option>
              <option value="Ready in 20 Mins">Ready in 20 Mins</option>
              <option value="Ready in 30 Mins">Ready in 30 Mins</option>
            </select>
          </div>
        </div>

        <!-- Dedicated "Upload Image" Box -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Upload Dress Image</label>
          <div class="border-2 border-dashed border-orange-300 bg-orange-50/40 hover:bg-orange-50 rounded-2xl p-6 text-center transition">
            <input type="file" id="dressImageFile" accept="image/*" required onchange="previewSelectedImage(event)" class="hidden">
            
            <label for="dressImageFile" class="cursor-pointer flex flex-col items-center justify-center">
              <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-2xl mb-2 shadow-sm border border-orange-100">
                📷
              </div>
              <span class="text-xs font-bold text-slate-900" id="uploadBtnTitle">Click here to Select Dress Photo</span>
              <span class="text-[11px] text-slate-500 mt-0.5">JPEG, PNG, WEBP from Gallery or Files</span>
            </label>

            <!-- Image Preview Box -->
            <div id="previewWrapper" class="hidden mt-4 pt-4 border-t border-orange-200">
              <img id="imagePreview" class="mx-auto max-h-56 rounded-2xl object-contain border border-slate-200 shadow-md">
              <p id="fileStatus" class="text-xs text-emerald-700 font-bold mt-2.5"></p>
            </div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-bold py-4 rounded-2xl text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2 cursor-pointer mt-6">
          <span>💬</span> Submit & Forward to Chitikelo Onboarding
        </button>

      </form>
    </div>

  </main>

  <script>
    var ADMIN_WHATSAPP = "919515552511"; // Enter your 10-digit WhatsApp number here

    function previewSelectedImage(event) {
      var file = event.target.files[0];
      if (file) {
        document.getElementById("uploadBtnTitle").innerText = "Change Photo (" + file.name + ")";
        document.getElementById("fileStatus").innerText = "✓ Selected: " + file.name + " (" + (file.size / 1024).toFixed(1) + " KB)";
        document.getElementById("imagePreview").src = URL.createObjectURL(file);
        document.getElementById("previewWrapper").classList.remove("hidden");
      }
    }

    function handleProductUpload(e) {
      e.preventDefault();

      var store = document.getElementById("partnerStoreName").value;
      var loc = document.getElementById("partnerLocation").value;
      var name = document.getElementById("dressName").value;
      var cat = document.getElementById("dressCategory").value;
      var sizes = document.getElementById("dressSizes").value;
      var price = document.getElementById("dressPrice").value;
      var eta = document.getElementById("dispatchTime").value;
      var fileInput = document.getElementById("dressImageFile");

      var fileName = fileInput.files.length > 0 ? fileInput.files[0].name : "No photo attached";

      var text = "👗 NEW STORE PRODUCT LISTING - CHITIKELO%0A%0A" +
                 "Store Name: " + store + "%0A" +
                 "Location: " + loc + "%0A" +
                 "Product Name: " + name + "%0A" +
                 "Category: " + cat + "%0A" +
                 "Sizes Available: " + sizes + "%0A" +
                 "Offer Price: ₹" + price + "%0A" +
                 "Prep ETA: " + eta + "%0A" +
                 "Selected Image File: " + fileName + "%0A%0A" +
                 "(Store owner: Please attach this dress photo directly in this chat now!)";

      window.open("https://wa.me/" + ADMIN_WHATSAPP + "?text=" + text, "_blank");
    }
  </script>
</body>
</html>
