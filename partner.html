<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Partner Hub (Store Dashboard)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-950 text-white px-4 py-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="bg-orange-600 text-white font-black px-2.5 py-1 rounded-xl text-sm">F60</div>
        <h1 class="font-extrabold text-base tracking-tight">Partner Hub (Store Dashboard)</h1>
      </div>
      <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition">
        🏠 Home / Shop
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
    <!-- Add Product Form Box -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
      <h2 class="font-extrabold text-base text-slate-900 mb-4">➕ Add New Boutique Outfit / Uniform</h2>
      <form onsubmit="addNewProduct(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
        <div>
          <label class="block font-bold text-slate-500 uppercase mb-1">Store Name</label>
          <input type="text" id="storeNameInput" required placeholder="e.g., Sai Fashions" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold">
        </div>
        <div>
          <label class="block font-bold text-slate-500 uppercase mb-1">Store Area / Location</label>
          <input type="text" id="storeAreaInput" required placeholder="e.g., Kamalanagar, Anantapur" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3">
        </div>
        <div>
          <label class="block font-bold text-slate-500 uppercase mb-1">Outfit / Uniform Name</label>
          <input type="text" id="prodNameInput" required placeholder="e.g., Designer Kurti Set" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3">
        </div>
        <div>
          <label class="block font-bold text-slate-500 uppercase mb-1">Category</label>
          <select id="prodCategoryInput" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold">
            <option value="Uniform">🎒 School Uniform</option>
            <option value="Kids">🧸 Kids Wear</option>
            <option value="Saree">🥻 Saree</option>
            <option value="Kurti">👗 Kurti</option>
            <option value="Lehenga">✨ Lehenga</option>
            <option value="Men">👔 Men's Wear</option>
          </select>
        </div>
        <div>
          <label class="block font-bold text-slate-500 uppercase mb-1">Price (₹)</label>
          <input type="number" id="prodPriceInput" required placeholder="899" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-mono">
        </div>
        <div>
          <label class="block font-bold text-slate-500 uppercase mb-1">Image URL</label>
          <input type="url" id="prodImageInput" required placeholder="https://images.unsplash.com/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3">
        </div>
        <div class="sm:col-span-2">
          <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-extrabold py-3.5 rounded-xl uppercase tracking-wider transition shadow">
            🚀 Publish Outfit to Live Customer Radar
          </button>
        </div>
      </form>
    </div>

    <!-- Incoming Orders Section -->
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
      <h2 class="font-extrabold text-base text-slate-900 mb-4">📦 Incoming Store Orders</h2>
      <div id="partnerOrdersList" class="space-y-3">
        <p class="text-xs text-slate-400">Loading orders...</p>
      </div>
    </div>
  </main>

  <script>
    var firebaseConfig = {
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    function addNewProduct(e) {
      e.preventDefault();
      var pData = {
        store: document.getElementById("storeNameInput").value.trim(),
        area: document.getElementById("storeAreaInput").value.trim(),
        name: document.getElementById("prodNameInput").value.trim(),
        category: document.getElementById("prodCategoryInput").value,
        price: parseInt(document.getElementById("prodPriceInput").value),
        image: document.getElementById("prodImageInput").value.trim(),
        timestamp: Date.now()
      };

      db.ref("boutique_products").push(pData).then(function() {
        alert("✓ Product published successfully!");
        e.target.reset();
      }).catch(function(err) {
        alert("Error: " + err.message);
      });
    }

    db.ref("orders").on("value", function(snapshot) {
      var data = snapshot.val() || {};
      var list = document.getElementById("partnerOrdersList");
      var html = "";

      var keys = Object.keys(data);
      if (keys.length === 0) {
        list.innerHTML = "<p class='text-xs text-slate-400'>No orders received yet.</p>";
        return;
      }

      keys.forEach(function(key) {
        var order = data[key];
        html += `
          <div class="p-4 bg-slate-50 border rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
            <div>
              <p class="font-black text-slate-900">Order ID: ${order.orderId} (${order.store || 'Boutique'})</p>
              <p class="text-slate-600 mt-0.5">Customer: <strong>${order.customerName}</strong> (${order.customerPhone})</p>
              <p class="text-slate-500">Address: ${order.customerAddress}</p>
              <p class="font-mono font-bold text-orange-600 mt-1">Total: ₹${order.totalAmount} | Status: ${order.paymentStatus}</p>
            </div>
            <div>
              <button onclick="acceptOrder('${key}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded-xl shadow transition">
                ✓ Accept & Pack (Ready)
              </button>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    });

    window.acceptOrder = function(orderKey) {
      db.ref("orders/" + orderKey).update({ boutiqueAccepted: true }).then(function() {
        alert("✓ Order accepted and marked ready for delivery rider!");
      });
    };
  </script>
</body>
</html>
