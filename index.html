<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fitin60 | 60-Minute Hyperlocal Fashion</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 text-white font-black px-2.5 py-1.5 rounded-xl tracking-wider text-lg shadow-md shadow-indigo-200">F60</div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight leading-none">FITIN60</h1>
                    <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-full">⚡ EXPRESS 60 MINS</span>
                </div>
            </div>
            <div>
                <a href="tracking.html" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 transition">
                    📦 My Orders
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 pt-4">
        <!-- Search Bar -->
        <div class="relative mb-4">
            <input type="text" id="searchInput" placeholder="Search sarees, kurtis, uniforms, kids wear..." class="w-full bg-white border border-slate-200 rounded-2xl px-4 py-3 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
            <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <!-- Categories Filter -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1">
            <button class="cat-btn px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow-sm whitespace-nowrap" data-cat="All">All Items</button>
            <button class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 text-xs font-bold rounded-xl whitespace-nowrap hover:bg-slate-50" data-cat="Uniforms">Uniforms</button>
            <button class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 text-xs font-bold rounded-xl whitespace-nowrap hover:bg-slate-50" data-cat="Kids">Kids Wear</button>
            <button class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 text-xs font-bold rounded-xl whitespace-nowrap hover:bg-slate-50" data-cat="Sarees">Sarees</button>
            <button class="cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 text-xs font-bold rounded-xl whitespace-nowrap hover:bg-slate-50" data-cat="Kurtis">Kurtis</button>
        </div>

        <!-- Hyperlocal Banner -->
        <div class="bg-gradient-to-r from-indigo-900 to-slate-900 text-white p-4 rounded-2xl mb-6 shadow-md relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-indigo-500/30 text-indigo-200 text-[10px] font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider">⚡ 15KM Hyper-Local</span>
                <h2 class="text-base font-bold mt-1">Boutique Fashion at your doorstep</h2>
                <p class="text-xs text-slate-300 mt-0.5">Directly delivered from local fashion stores in 60 minutes.</p>
            </div>
        </div>

        <!-- Products Section Heading -->
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-extrabold text-sm text-slate-800 uppercase tracking-wider">Available Catalog</h3>
            <span id="itemCount" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">Loading...</span>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-2 gap-3">
            <!-- Dynamic Products will load here -->
        </div>
    </main>

    <!-- Bottom Navigation Bar (Customer Only) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2.5 px-6 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <a href="index.html" class="flex flex-col items-center text-indigo-600 font-bold text-[10px]">
                <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Explore
            </a>
            <a href="tracking.html" class="flex flex-col items-center text-slate-400 hover:text-slate-600 font-semibold text-[10px]">
                <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                Tracking
            </a>
        </div>
    </nav>

    <!-- Firebase Script Logic for Fetching Products -->
    <script>
        // Initialize Firebase (Using your database configuration)
        const firebaseConfig = {
            databaseURL: "https://fitin60-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allProducts = [];
        let currentCategory = "All";

        // Fetch products from Firebase Realtime Database
        function fetchProducts() {
            const productsRef = db.ref('products');
            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                allProducts = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        allProducts.push({ id: key, ...data[key] });
                    });
                }
                renderProducts(allProducts);
            }, (error) => {
                console.error("Error loading products:", error);
                document.getElementById('itemCount').innerText = "Error loading";
            });
        }

        // Render products into grid
        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            const itemCount = document.getElementById('itemCount');
            grid.innerHTML = '';
            itemCount.innerText = ${products.length} Items;

            if (products.length === 0) {
                grid.innerHTML = <div class="col-span-2 text-center py-10 text-slate-400 text-xs font-semibold">No fashion items available right now.</div>;
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-3 shadow-sm flex flex-col justify-between hover:shadow-md transition";
                card.innerHTML = `
                    <div>
                        <div class="bg-slate-100 rounded-xl h-36 mb-2 overflow-hidden flex items-center justify-center relative">
                            <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.name}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-black/60 backdrop-blur-sm text-white text-[9px] font-extrabold px-2 py-0.5 rounded-md uppercase">${p.category || 'Fashion'}</span>
                        </div>
                        <h4 class="font-bold text-xs text-slate-800 line-clamp-1">${p.name}</h4>
                        <p class="text-[10px] text-slate-500 line-clamp-1 mt-0.5">📍 ${p.storeName || 'Local Boutique'}</p>
                    </div>
                    <div class="mt-3 flex items-center justify-between">
                        <span class="font-extrabold text-sm text-indigo-600">₹${p.price || '0'}</span>
                        <button onclick="buyNow('${p.id}', '${p.name}', '${p.price}', '${p.storeName || 'Boutique'}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-xl text-[10px] shadow-sm shadow-indigo-100 transition">
                            Buy 60M
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Buy Action & Checkout Redirect
        function buyNow(id, name, price, storeName) {
            const orderData = {
                productId: id,
                productName: name,
                price: price,
                storeName: storeName,
                orderTime: new Date().toISOString(),
                status: "Order Placed"
            };
            localStorage.setItem('currentOrder', JSON.stringify(orderData));
            window.location.href = 'tracking.html';
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.name && p.name.toLowerCase().includes(query)) || 
                (p.storeName && p.storeName.toLowerCase().includes(query)) ||
                (p.category && p.category.toLowerCase().includes(query))
            );
            renderProducts(filtered);
        });

        // Category filter buttons
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => {
                    b.className = "cat-btn px-4 py-2 bg-white text-slate-600 border border-slate-200 text-xs font-bold rounded-xl whitespace-nowrap hover:bg-slate-50";
                });
                e.target.className = "cat-btn px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow-sm whitespace-nowrap";
                
                const cat = e.target.getAttribute('data-cat');
                if (cat === 'All') {
                    renderProducts(allProducts);
                } else {
                    const filtered = allProducts.filter(p => p.category === cat);
                    renderProducts(filtered);
                }
            });
        });

        // Load products on start
        window.onload = fetchProducts;
    </script>
</body>
</html>
