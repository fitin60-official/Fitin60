<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Order Tracking | Fitin60</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  
  <!-- Leaflet CSS & JS for Free Live GPS Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      color: #0f172a;
      overflow-x: hidden;
      width: 100%;
    }
    .font-brand { font-family: 'Syne', sans-serif; }
    .font-mono-num { font-family: 'Space Grotesk', sans-serif; }
    #map { height: 260px; width: 100%; border-radius: 1.5rem; z-index: 10; }
  </style>
</head>
<body class="min-h-screen pb-28 antialiased selection:bg-orange-500 selection:text-white w-full">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-slate-200/80 px-4 sm:px-6 h-18 flex items-center justify-between shadow-xs w-full">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center text-white font-brand font-black text-lg shadow-md">F</div>
      <span class="font-brand text-xl font-black tracking-tight text-slate-950">
        FITIN<span class="text-orange-600">60</span>
      </span>
    </a>
    <a href="index.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-2 rounded-2xl transition">
      ← Back to Explore
    </a>
  </header>

  <main class="max-w-2xl mx-auto px-4 mt-6 space-y-5 w-full">
    <!-- Order Header Card -->
    <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-200/80 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <div>
          <span id="orderIdBadge" class="text-[10px] font-black bg-orange-100 text-orange-800 px-3 py-1 rounded-full uppercase tracking-wider">Order #FIT-XXXX</span>
          <h1 id="orderStatusTitle" class="font-brand font-black text-xl text-slate-950 mt-1">Finding nearby rider...</h1>
        </div>
        <div class="text-right">
          <p class="text-[10px] font-bold text-slate-400 uppercase">Estimated Drop</p>
          <p class="font-mono-num font-black text-2xl text-emerald-600 animate-pulse" id="countdownTimer">59:59</p>
        </div>
      </div>

      <!-- Live GPS Map View -->
      <div class="space-y-2">
        <div class="flex justify-between items-center text-xs font-bold text-slate-700">
          <span>📍 Live Rider Navigation Map</span>
          <span class="text-orange-600 bg-orange-50 px-2.5 py-0.5 rounded-md">Realtime GPS Sync</span>
        </div>
        <div id="map" class="shadow-inner border border-slate-200"></div>
      </div>

      <!-- Delivery Details -->
      <div class="bg-slate-50 rounded-2xl p-4 space-y-2.5 text-xs border border-slate-100">
        <div class="flex justify-between">
          <span class="text-slate-500 font-medium">Store Name:</span>
          <span class="font-bold text-slate-900" id="storeNameLabel">Boutique Studio</span>
        </div>
        <div class="flex justify-between">
          <span class="text-slate-500 font-medium">Delivery Address:</span>
          <span class="font-bold text-slate-900 text-right truncate max-w-[220px]" id="deliveryAddressLabel">Customer Address</span>
        </div>
        <div class="flex justify-between border-t border-slate-200 pt-2">
          <span class="text-slate-500 font-medium">Secure Delivery OTP:</span>
          <span class="font-mono font-black text-orange-600 bg-orange-50 px-2 py-0.5 rounded text-sm" id="deliveryOtpLabel">----</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-2xl border-t border-slate-200/80 py-3 px-8 flex items-center justify-around z-40 shadow-2xl">
    <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-orange-600 font-bold group">
      <span class="text-xl group-hover:scale-110 transition">🏬</span>
      <span class="text-[10px] mt-1 font-medium">Explore</span>
    </a>
    <a href="tracking.html" class="flex flex-col items-center text-orange-600 font-bold group">
      <span class="text-xl group-hover:scale-110 transition">⚡</span>
      <span class="text-[10px] mt-1 font-black">Orders</span>
    </a>
  </nav>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    // Initialize Leaflet Map centered around Anantapur / Default Radar Area
    var map = L.map('map').setView([14.6819, 77.6006], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© Fitin60 Express'
    }).addTo(map);

    var storeMarker = L.marker([14.6850, 77.5950]).addTo(map).bindPopup("🏬 Boutique Store");
    var customerMarker = L.marker([14.6780, 77.6080]).addTo(map).bindPopup("🏠 Delivery Location");
    var riderMarker = L.marker([14.6815, 77.5990]).addTo(map).bindPopup("⚡ Live Rider").openPopup();

    var activeOrder = null;
    try {
      var saved = localStorage.getItem("chitikelo_active_order");
      if (saved) activeOrder = JSON.parse(saved);
    } catch(e) {}

    if (activeOrder) {
      document.getElementById("orderIdBadge").innerText = "Order #" + activeOrder.orderId;
      document.getElementById("orderStatusTitle").innerText = activeOrder.status || "Rider assigned & heading to store";
      document.getElementById("storeNameLabel").innerText = activeOrder.store || "Boutique Studio";
      document.getElementById("deliveryAddressLabel").innerText = activeOrder.customerAddress || "Expressed Delivery";
      document.getElementById("deliveryOtpLabel").innerText = activeOrder.deliveryOtp || "4821";
    }

    // Countdown Timer simulation
    var timerSecs = 59 * 60;
    setInterval(function() {
      if (timerSecs > 0) timerSecs--;
      var m = Math.floor(timerSecs / 60);
      var s = timerSecs % 60;
      document.getElementById("countdownTimer").innerText = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }, 1000);

    // Simulate Rider movement on map in realtime
    var latStep = 0.0002;
    var lngStep = 0.0003;
    setInterval(function() {
      var cur = riderMarker.getLatLng();
      var newLat = cur.lat + (Math.random() - 0.4) * latStep;
      var newLng = cur.lng + (Math.random() - 0.4) * lngStep;
      riderMarker.setLatLng([newLat, newLng]);
      map.panTo([newLat, newLng]);
    }, 4000);
  </script>
</body>
</html>
