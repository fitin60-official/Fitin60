<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitin60 | Live Radar Map & Order Tracking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Syne', sans-serif; }
    .font-mono-num { font-family: 'Space Grotesk', sans-serif; }
    #liveRadarMap { height: 260px; border-radius: 1.5rem; }
  </style>
</head>
<body class="bg-[#fafaf9] text-slate-900 min-h-screen pb-20">

  <header class="bg-white border-b border-slate-200 px-6 h-20 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-1.5">
      <span class="font-brand text-2xl font-black">FITIN<span class="text-orange-600">60</span></span>
      <span class="text-[9px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded-full">LIVE RADAR</span>
    </div>
    <a href="index.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl">← Home</a>
  </header>

  <main class="max-w-2xl mx-auto px-4 mt-8 space-y-6">

    <div class="bg-white rounded-[2.5rem] border border-slate-200 p-6 sm:p-8 shadow-xl space-y-6">
      
      <!-- Countdown & Status -->
      <div class="flex justify-between items-center border-b pb-4">
        <div>
          <span class="text-[10px] font-black uppercase text-slate-400">Order Reference</span>
          <h2 id="trackOrderId" class="font-mono-num font-black text-2xl">FIT-XXXX</h2>
        </div>
        <div class="text-right">
          <span class="text-[10px] font-black uppercase text-slate-400">60-Min Radar ETA</span>
          <p id="countdownTimer" class="font-mono-num font-black text-2xl text-orange-600">59:59</p>
        </div>
      </div>

      <!-- Live Interactive Map Showing Delivery Boy & Customer -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-slate-700">🛵 Rider Live GPS Radar</span>
          <span id="riderStatusPill" class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-md font-bold">Connecting...</span>
        </div>
        <div id="liveRadarMap" class="w-full border border-slate-200 shadow-inner"></div>
      </div>

      <!-- WhatsApp Dispatch Notification -->
      <a id="whatsappDispatchBtn" href="#" target="_blank" class="w-full bg-[#25D366] hover:bg-[#20bd5a] text-white font-black py-3.5 rounded-2xl text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-md">
        <span>📲</span> Notify Boutique & Rider on WhatsApp
      </a>

      <!-- Summary Details -->
      <div class="p-4 bg-slate-50 rounded-2xl space-y-2 text-xs">
        <p><strong>Item:</strong> <span id="trackItemName">Outfit</span></p>
        <p><strong>Boutique:</strong> <span id="trackStore">Boutique</span></p>
        <p><strong>Delivery Location:</strong> <span id="trackCustAddr">Address</span></p>
        <p><strong>Current Status:</strong> <span id="trackPayment" class="text-orange-600 font-bold">Waiting for Boutique Acceptance</span></p>
      </div>

    </div>

  </main>

  <script>
    var map, riderMarker, customerMarker;

    function initMap(cLat, cLng) {
      map = L.map('liveRadarMap').setView([cLat, cLng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Customer Pin
      customerMarker = L.marker([cLat, cLng]).addTo(map).bindPopup("<b>Your Delivery Location</b>").openPopup();

      // Initial Rider position slightly offset
      riderMarker = L.marker([cLat + 0.005, cLng + 0.005]).addTo(map).bindPopup("<b>🛵 Fitin60 Rider</b>");
    }

    function updateRiderOnMap() {
      var rawRiderGPS = localStorage.getItem("fitin60_rider_gps");
      var pill = document.getElementById("riderStatusPill");
      if (rawRiderGPS && riderMarker) {
        var gps = JSON.parse(rawRiderGPS);
        riderMarker.setLatLng([gps.lat, gps.lng]);
        pill.innerText = "Live at " + gps.updatedAt;
        pill.classList.replace("bg-orange-100", "bg-emerald-100");
        pill.classList.replace("text-orange-700", "text-emerald-700");
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      var rawOrder = localStorage.getItem("chitikelo_active_order");
      if (rawOrder) {
        var order = JSON.parse(rawOrder);
        var item = order.items && order.items[0] ? order.items[0] : { name: "Designer Dress" };

        document.getElementById("trackOrderId").innerText = order.orderId;
        document.getElementById("trackItemName").innerText = item.name;
        document.getElementById("trackStore").innerText = order.store;
        document.getElementById("trackCustAddr").innerText = order.customerAddress;
        document.getElementById("trackPayment").innerText = order.paymentStatus;

        var cLat = parseFloat(order.customerLat) || 14.6819;
        var cLng = parseFloat(order.customerLng) || 77.6006;
        initMap(cLat, cLng);

        var waText = "⚡ FITIN60 EXPRESS ORDER TRACKING\n\nOrder: " + order.orderId + "\nStore: " + order.store + "\nItem: " + item.name + "\nAddress: " + order.customerAddress;
        document.getElementById("whatsappDispatchBtn").href = "https://wa.me/?text=" + encodeURIComponent(waText);
      }
      setInterval(updateRiderOnMap, 3000);
    });

    // Countdown
    var timeLeft = 59 * 60 + 59;
    setInterval(function() {
      if (timeLeft <= 0) return;
      timeLeft--;
      var m = Math.floor(timeLeft / 60);
      var s = timeLeft % 60;
      document.getElementById("countdownTimer").innerText = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }, 1000);
  </script>
</body>
</html>
