<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fitin60 | My Orders & History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body { overflow-x: hidden !important; width: 100% !important; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Syne', sans-serif; }
    .font-mono-num { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#fafaf9] text-slate-900 min-h-screen pb-24 antialiased">

  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 h-16 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-1.5">
      <span class="font-brand text-xl font-black">FITIN<span class="text-orange-600">60</span></span>
      <span class="text-[9px] bg-slate-100 text-slate-700 font-bold px-1.5 py-0.5 rounded">MY ORDERS</span>
    </div>
    <a href="index.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl">
      ← Radar
    </a>
  </header>

  <main class="max-w-lg mx-auto px-4 mt-6 space-y-6">

    <div id="loginPromptCard" class="hidden bg-white rounded-3xl border border-slate-200 p-6 text-center shadow-lg space-y-3">
      <div class="text-3xl">🔒</div>
      <h2 class="font-brand font-black text-lg text-slate-950">Login to View Orders</h2>
      <p class="text-xs text-slate-500">Your orders are strictly private to your registered mobile number.</p>
      <a href="index.html" class="inline-block bg-slate-950 text-white font-bold px-4 py-2 rounded-xl text-xs uppercase">
        Go to Login
      </a>
    </div>

    <div id="emptyOrdersCard" class="hidden bg-white rounded-3xl border border-slate-200 p-8 text-center space-y-3">
      <div class="text-3xl">🛍️</div>
      <h3 class="font-brand font-black text-lg text-slate-950">No Orders Found</h3>
      <p class="text-xs text-slate-500">You have no active or completed orders yet.</p>
      <a href="index.html" class="inline-block bg-orange-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs uppercase">
        Explore Boutiques
      </a>
    </div>

    <!-- Active & History Orders Container -->
    <div id="privateOrdersContainer" class="space-y-4"></div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var currentCustomer = null;

    function checkAuth() {
      var saved = localStorage.getItem("fitin60_customer_user");
      if (saved) {
        currentCustomer = JSON.parse(saved);
        loadCustomerOrders(currentCustomer.phone);
      } else {
        document.getElementById("loginPromptCard").classList.remove("hidden");
      }
    }

    function loadCustomerOrders(phone) {
      db.ref("orders").on("value", function(snapshot) {
        var orders = snapshot.val();
        var container = document.getElementById("privateOrdersContainer");
        var emptyCard = document.getElementById("emptyOrdersCard");

        if (!orders) {
          emptyCard.classList.remove("hidden");
          container.innerHTML = "";
          return;
        }

        var myOrders = Object.values(orders).filter(function(o) {
          return String(o.customerPhone).trim() === String(phone).trim();
        }).reverse();

        if (myOrders.length === 0) {
          emptyCard.classList.remove("hidden");
          container.innerHTML = "";
          return;
        }

        emptyCard.classList.add("hidden");
        var html = "";

        myOrders.forEach(function(order) {
          var firstItem = order.items && order.items[0] ? order.items[0] : { name: "Designer Outfit", size: "M" };
          var isCancelled = order.paymentStatus === "Cancelled by Customer";
          var isDelivered = order.status === "Delivered";

          html += 
            '<div class="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm space-y-3">' +
              '<div class="flex justify-between items-start border-b pb-3">' +
                '<div>' +
                  '<span class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Order ID</span>' +
                  '<h2 class="font-mono-num font-black text-lg text-slate-950">' + order.orderId + '</h2>' +
                '</div>' +
                '<span class="text-[11px] font-bold ' + (isCancelled ? 'text-rose-600 bg-rose-50' : isDelivered ? 'text-emerald-700 bg-emerald-50' : 'text-orange-600 bg-orange-50') + ' border px-2.5 py-1 rounded-xl">' +
                  order.paymentStatus +
                '</span>' +
              '</div>' +

              '<div class="p-3 bg-slate-50 rounded-2xl text-xs space-y-1">' +
                '<p class="font-bold text-slate-900">' + firstItem.name + ' (' + (firstItem.size || "M") + ')</p>' +
                '<p class="text-slate-500">Store: <strong>' + order.store + '</strong></p>' +
                '<p class="font-mono-num font-black text-slate-950 pt-1">Total: ₹' + order.totalAmount + '</p>' +
              '</div>' +

              '<div class="flex items-center gap-2 pt-1">' +
                (!isCancelled && !isDelivered ? 
                  '<button onclick="cancelCustomerOrder(\'' + order.orderId + '\')" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 font-bold py-2 rounded-xl text-xs cursor-pointer">🚫 Cancel Order</button>' : 
                  '<span class="flex-1 text-[11px] text-slate-400 font-bold text-center bg-slate-50 py-2 rounded-xl">' + (isCancelled ? 'Order Cancelled' : 'Order Delivered') + '</span>') +
                
                '<button onclick="deleteCustomerOrderPermanent(\'' + order.orderId + '\')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold px-3 py-2 rounded-xl text-xs cursor-pointer" title="Delete from History">🗑️ Delete</button>' +
              '</div>' +
            '</div>';
        });

        container.innerHTML = html;
      });
    }

    // 1. CANCEL ORDER (Updates status, keeps in history)
    function cancelCustomerOrder(orderId) {
      if (confirm("Are you sure you want to cancel this order (" + orderId + ")?")) {
        db.ref("orders/" + orderId).update({
          paymentStatus: "Cancelled by Customer",
          status: "Cancelled"
        }).then(function() {
          alert("✓ Order cancelled.");
        });
      }
    }

    // 2. PERMANENT DELETE (Removes completely from database)
    function deleteCustomerOrderPermanent(orderId) {
      if (confirm("Permanently delete this order record (" + orderId + ") from database?")) {
        db.ref("orders/" + orderId).remove().then(function() {
          alert("✓ Order record deleted.");
        });
      }
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
