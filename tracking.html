<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fitin60 | Live Order Tracking & GPS Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <!-- Leaflet Maps for Real-Time GPS Tracking -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@600;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body { overflow-x: hidden !important; width: 100% !important; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-brand { font-family: 'Syne', sans-serif; }
    .font-mono-num { font-family: 'Space Grotesk', sans-serif; }
    .leaflet-container { height: 210px; border-radius: 1.25rem; z-index: 10; width: 100%; }
    .pulse-ring {
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseGreen 1.6s infinite cubic-bezier(0.66, 0, 1);
    }
    @keyframes pulseGreen {
      to { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body class="bg-[#fafaf9] text-slate-900 min-h-screen pb-24 antialiased">

  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 h-16 flex items-center justify-between shadow-sm sticky top-0 z-40">
    <div class="flex items-center gap-1.5">
      <span class="font-brand text-xl font-black">FITIN<span class="text-orange-600">60</span></span>
      <span class="text-[9px] bg-orange-100 text-orange-700 font-bold px-1.5 py-0.5 rounded">LIVE RADAR</span>
    </div>
    <a href="index.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1.5 rounded-xl transition">
      ← Store
    </a>
  </header>

  <main class="max-w-xl mx-auto px-3.5 mt-5 space-y-5">

    <div id="loginPromptCard" class="hidden bg-white rounded-3xl border border-slate-200 p-6 text-center shadow-lg space-y-3">
      <div class="text-3xl">🔒</div>
      <h2 class="font-brand font-black text-lg text-slate-950">Login to Track Orders</h2>
      <p class="text-xs text-slate-500">Your orders are strictly private and linked to your mobile.</p>
      <a href="index.html" class="inline-block bg-slate-950 text-white font-bold px-4 py-2 rounded-xl text-xs uppercase">
        Go to Login
      </a>
    </div>

    <div id="emptyOrdersCard" class="hidden bg-white rounded-3xl border border-slate-200 p-8 text-center space-y-3">
      <div class="text-3xl">🛍️</div>
      <h3 class="font-brand font-black text-lg text-slate-950">No Active Orders</h3>
      <p class="text-xs text-slate-500">Pick any boutique outfit to get delivery in 60 minutes!</p>
      <a href="index.html" class="inline-block bg-orange-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs uppercase">
        Explore Boutiques
      </a>
    </div>

    <!-- Active & History Live Tracking Container -->
    <div id="privateOrdersContainer" class="space-y-6"></div>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var currentCustomer = null;
    var activeMaps = {};

    function checkAuth() {
      var saved = localStorage.getItem("fitin60_customer_user");
      if (saved) {
        currentCustomer = JSON.parse(saved);
        loadCustomerOrders(currentCustomer.phone);
      } else {
        document.getElementById("loginPromptCard").classList.remove("hidden");
      }
    }

    function loadCustomerOrders(phone) {
      db.ref("orders").on("value", function(snapshot) {
        var orders = snapshot.val();
        var container = document.getElementById("privateOrdersContainer");
        var emptyCard = document.getElementById("emptyOrdersCard");

        if (!orders) {
          emptyCard.classList.remove("hidden");
          container.innerHTML = "";
          return;
        }

        var myOrders = Object.values(orders).filter(function(o) {
          return String(o.customerPhone).trim() === String(phone).trim();
        }).reverse();

        if (myOrders.length === 0) {
          emptyCard.classList.remove("hidden");
          container.innerHTML = "";
          return;
        }

        emptyCard.classList.add("hidden");
        var html = "";

        myOrders.forEach(function(order) {
          var firstItem = order.items && order.items[0] ? order.items[0] : { name: "Designer Outfit", size: "M" };
          var isCancelled = (order.paymentStatus === "Cancelled by Customer" || order.status === "Cancelled");
          var isDelivered = (order.status === "Delivered");
          var isRiderAssigned = (order.riderAssigned === true);

          // Step 1: Placed, Step 2: Boutique Accepted, Step 3: Rider Dispatched, Step 4: Delivered
          var step = 1;
          if (order.boutiqueAccepted) step = 2;
          if (isRiderAssigned) step = 3;
          if (isDelivered) step = 4;

          html += 
            '<div class="bg-white rounded-3xl border border-slate-200/90 p-5 shadow-sm space-y-4">' +
              
              '<div class="flex justify-between items-start border-b border-slate-100 pb-3">' +
                '<div>' +
                  '<span class="text-[9px] font-black uppercase text-slate-400 tracking-wider">Tracking Order</span>' +
                  '<h2 class="font-mono-num font-black text-xl text-slate-950">' + order.orderId + '</h2>' +
                '</div>' +
                '<span class="text-[11px] font-bold ' + 
                  (isCancelled ? 'text-rose-600 bg-rose-50 border-rose-200' : isDelivered ? 'text-emerald-700 bg-emerald-50 border-emerald-200' : 'text-orange-600 bg-orange-50 border-orange-200') + 
                  ' border px-3 py-1 rounded-xl">' +
                  order.paymentStatus +
                '</span>' +
              '</div>' +

              // 4-STEP LIVE PROGRESS BAR
              (!isCancelled ? 
                '<div class="py-2">' +
                  '<div class="grid grid-cols-4 gap-1 text-center">' +
                    '<div class="space-y-1">' +
                      '<div class="h-1.5 rounded-full ' + (step >= 1 ? 'bg-emerald-500' : 'bg-slate-200') + '"></div>' +
                      '<span class="text-[9px] font-bold ' + (step >= 1 ? 'text-slate-900' : 'text-slate-400') + '">Placed</span>' +
                    '</div>' +
                    '<div class="space-y-1">' +
                      '<div class="h-1.5 rounded-full ' + (step >= 2 ? 'bg-emerald-500' : 'bg-slate-200') + '"></div>' +
                      '<span class="text-[9px] font-bold ' + (step >= 2 ? 'text-slate-900' : 'text-slate-400') + '">Prepared</span>' +
                    '</div>' +
                    '<div class="space-y-1">' +
                      '<div class="h-1.5 rounded-full ' + (step >= 3 ? 'bg-emerald-500' : 'bg-slate-200') + '"></div>' +
                      '<span class="text-[9px] font-bold ' + (step >= 3 ? 'text-slate-900' : 'text-slate-400') + '">On Way</span>' +
                    '</div>' +
                    '<div class="space-y-1">' +
                      '<div class="h-1.5 rounded-full ' + (step >= 4 ? 'bg-emerald-500' : 'bg-slate-200') + '"></div>' +
                      '<span class="text-[9px] font-bold ' + (step >= 4 ? 'text-slate-900' : 'text-slate-400') + '">Delivered</span>' +
                    '</div>' +
                  '</div>' +
                '</div>' : '') +

              // RIDER LIVE GPS RADAR MAP (Shows when rider accepts the order)
              (isRiderAssigned && !isDelivered && !isCancelled ?
                '<div class="space-y-2.5 pt-1">' +
                  '<div class="flex items-center justify-between">' +
                    '<div class="flex items-center gap-2">' +
                      '<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-ring"></span>' +
                      '<span class="text-xs font-bold text-slate-800">Rider Live Radar Location</span>' +
                    '</div>' +
                    '<span class="text-[10px] font-mono-num font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded">ETA: ~18 MINS</span>' +
                  '</div>' +

                  '<div id="map_' + order.orderId + '" class="leaflet-container border border-slate-200 shadow-inner"></div>' +

                  // Delivery Boy Card with Direct Call Button
                  '<div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl flex items-center justify-between">' +
                    '<div class="flex items-center gap-2.5">' +
                      '<div class="w-9 h-9 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center font-bold text-sm">🛵</div>' +
                      '<div>' +
                        '<h4 class="font-bold text-xs text-slate-900">' + (order.riderName || "Delivery Partner") + '</h4>' +
                        '<p class="text-[10px] text-slate-500">Fitin60 Fleet Rider</p>' +
                      '</div>' +
                    '</div>' +
                    '<a href="tel:' + (order.riderPhone || "") + '" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 shadow-sm transition">' +
                      '<span>📞</span> Call Rider' +
                    '</a>' +
                  '</div>' +
                '</div>' : '') +

              // Outfit & Pricing Details
              '<div class="p-3.5 bg-slate-50 rounded-2xl text-xs space-y-1.5">' +
                '<div class="flex justify-between items-center">' +
                  '<p class="font-bold text-slate-900">' + firstItem.name + '</p>' +
                  '<span class="font-mono-num font-bold bg-white border border-slate-200 px-2 py-0.5 rounded text-[10px]">Size: ' + (firstItem.size || "Free Size") + '</span>' +
                '</div>' +
                '<p class="text-slate-500">Boutique: <strong class="text-slate-800">' + order.store + '</strong></p>' +
                '<p class="text-slate-500">📍 Destination: ' + order.customerAddress + '</p>' +
                '<div class="flex justify-between items-baseline pt-2 border-t border-slate-200 font-black">' +
                  '<span class="text-[10px] uppercase text-slate-500">Total Payable:</span>' +
                  '<span class="font-mono-num text-base text-slate-950">₹' + order.totalAmount + '</span>' +
                '</div>' +
              '</div>' +

              // Action Buttons: Cancel Order & Delete Record
              '<div class="flex items-center gap-2 pt-1">' +
                (!isCancelled && !isDelivered ? 
                  '<button onclick="cancelCustomerOrder(\'' + order.orderId + '\')" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">🚫 Cancel Order</button>' : 
                  '<span class="flex-1 text-xs font-bold text-center bg-slate-50 text-slate-400 py-2.5 rounded-xl border border-slate-200">' + (isCancelled ? 'Order Cancelled' : 'Delivered to You 🎉') + '</span>') +
                
                '<button onclick="deleteCustomerOrderPermanent(\'' + order.orderId + '\')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-bold px-3 py-2.5 rounded-xl text-xs transition cursor-pointer" title="Delete from History">🗑️ Delete</button>' +
              '</div>' +

            '</div>';
        });

        container.innerHTML = html;

        // Initialize GPS Maps for Assigned Riders
        myOrders.forEach(function(order) {
          if (order.riderAssigned && order.status !== "Delivered" && order.paymentStatus !== "Cancelled by Customer") {
            setTimeout(function() {
              initOrderLeafletMap(order);
            }, 300);
          }
        });

      });
    }

    // Leaflet GPS Map Setup (Shows Customer pin and Moving Rider pin)
    function initOrderLeafletMap(order) {
      var mapId = "map_" + order.orderId;
      var el = document.getElementById(mapId);
      if (!el) return;

      var custLat = parseFloat(order.customerLat) || 14.6819;
      var custLng = parseFloat(order.customerLng) || 77.6006;
      // Rider simulated offset near customer
      var riderLat = custLat + 0.007;
      var riderLng = custLng + 0.007;

      if (activeMaps[order.orderId]) {
        activeMaps[order.orderId].remove();
      }

      var map = L.map(mapId, { attributionControl: false, zoomControl: false }).setView([custLat, custLng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      // Customer Location Marker
      L.marker([custLat, custLng]).addTo(map).bindPopup("📍 Your Delivery Address").openPopup();

      // Rider Marker with custom icon
      var riderIcon = L.divIcon({
        html: '<div class="text-2xl bg-white rounded-full shadow-lg p-1">🛵</div>',
        className: 'custom-rider-icon',
        iconSize: [30, 30]
      });
      L.marker([riderLat, riderLng], { icon: riderIcon }).addTo(map).bindPopup("Rider: " + (order.riderName || "Sai"));

      activeMaps[order.orderId] = map;
    }

    function cancelCustomerOrder(orderId) {
      if (confirm("Are you sure you want to cancel order (" + orderId + ")?")) {
        db.ref("orders/" + orderId).update({
          paymentStatus: "Cancelled by Customer",
          status: "Cancelled"
        }).then(function() {
          alert("✓ Order cancelled.");
        });
      }
    }

    function deleteCustomerOrderPermanent(orderId) {
      if (confirm("Permanently delete this order (" + orderId + ") from records?")) {
        db.ref("orders/" + orderId).remove().then(function() {
          alert("✓ Order record deleted.");
        });
      }
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
