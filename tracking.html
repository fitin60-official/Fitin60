<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Order Tracking | Fitin60</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0; padding: 0; background-color: #f8fafc; color: #0f172a; width: 100%;
    }
    .font-brand { font-family: 'Syne', sans-serif; }
    .font-mono-num { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="min-h-screen pb-32 antialiased selection:bg-orange-500 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-slate-200/80 px-4 sm:px-8 h-18 flex items-center justify-between shadow-xs">
    <a href="index.html" class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-orange-600 via-amber-500 to-yellow-400 flex items-center justify-center text-white font-brand font-black text-lg shadow-md">F</div>
      <span class="font-brand text-lg font-black tracking-tight text-slate-950">FITIN<span class="text-orange-600">60</span></span>
    </a>
    <a href="index.html" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-2xl text-slate-900 transition">← Explore Stores</a>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 mt-6 space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="font-brand font-black text-xl sm:text-2xl text-slate-950">📦 My Live Orders & Tracking</h1>
      <span id="activeOrdersCount" class="text-xs bg-orange-100 text-orange-800 font-black px-3.5 py-1.5 rounded-full">Syncing...</span>
    </div>

    <!-- Orders Container -->
    <div id="allMyOrdersContainer" class="space-y-6">
      <div class="bg-white rounded-3xl p-8 border border-slate-200 text-center space-y-3 shadow-sm">
        <p class="text-3xl">⏳</p>
        <p class="text-xs text-slate-500 font-bold">Fetching your active orders from radar...</p>
      </div>
    </div>

    <!-- Global WhatsApp Support Box -->
    <div class="bg-emerald-900 text-white rounded-3xl p-6 shadow-xl space-y-3">
      <div class="flex items-center gap-3">
        <span class="text-2xl">💬</span>
        <div>
          <h3 class="font-brand font-bold text-base">Fitin60 Instant WhatsApp Support</h3>
          <p class="text-xs text-emerald-200">Have questions regarding size difference or delivery? Chat with us instantly!</p>
        </div>
      </div>
      <a href="https://wa.me/919515552511?text=Hi%20Fitin60%20Support%2C%20I%20need%20help%20with%20my%20order%20and%20size%20coordination." target="_blank" class="block w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-center py-3.5 rounded-2xl text-xs uppercase tracking-wider transition shadow-md">
        💬 Open WhatsApp Support Chat ➔
      </a>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-2xl border-t border-slate-200/80 py-3 px-8 flex items-center justify-around z-40 shadow-2xl">
    <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-orange-600 font-bold">
      <span class="text-xl">🏬</span>
      <span class="text-[10px] mt-1 font-medium">Explore</span>
    </a>
    <a href="tracking.html" class="flex flex-col items-center text-orange-600 font-bold">
      <span class="text-xl">⚡</span>
      <span class="text-[10px] mt-1 font-black">Orders</span>
    </a>
  </nav>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyCJHY2v2Fl3QXNVZp-9w6S6C6NFrRMNn4g",
      authDomain: "fitin60.firebaseapp.com",
      databaseURL: "https://fitin60-default-rtdb.firebaseio.com",
      projectId: "fitin60",
      storageBucket: "fitin60.firebasestorage.app",
      messagingSenderId: "349862141371",
      appId: "1:349862141371:web:3460de52b7105f1cc4f89e"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    var currentCustomer = null;
    try {
      var saved = localStorage.getItem("fitin60_customer_user");
      if (saved) currentCustomer = JSON.parse(saved);
    } catch(e) {}

    function loadCustomerOrders() {
      db.ref("orders").on("value", function(snap) {
        var orders = snap.val() || {};
        var container = document.getElementById("allMyOrdersContainer");
        var countBadge = document.getElementById("activeOrdersCount");
        var html = "";
        var myOrdersCount = 0;

        Object.keys(orders).forEach(function(oId) {
          var o = orders[oId];
          if (o && (currentCustomer && currentCustomer.phone && o.customerPhone === currentCustomer.phone || !currentCustomer)) {
            myOrdersCount++;
            var isDelivered = o.delivered === true || o.status === "Delivered & Paid Successfully";
            var isAccepted = o.boutiqueAccepted === true;
            var isPickedUp = o.orderPickedUp === true;

            var storeMob = o.storeMobile || "9515552511";
            var storeWhatsAppUrl = "https://wa.me/91" + storeMob + "?text=Hi%20" + encodeURIComponent(o.store || 'Boutique') + "%2C%20regarding%20my%20order%20%23" + o.orderId + "%2C%20I%20have%20a%20query%20about%20size%20difference.";

            html += '<div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/90 shadow-md space-y-4 relative overflow-hidden">' +
              '<div class="flex flex-wrap justify-between items-center gap-2 border-b pb-3">' +
                '<div>' +
                  '<span class="font-mono text-xs font-black text-orange-600">Order #' + o.orderId + '</span>' +
                  '<h3 class="font-brand font-black text-base text-slate-950 mt-0.5">🏬 ' + (o.store || 'Boutique Store') + '</h3>' +
                '</div>' +
                '<span class="text-[10px] font-black px-3 py-1 rounded-full ' + (isDelivered ? 'bg-emerald-100 text-emerald-800' : 'bg-orange-100 text-orange-800 animate-pulse') + '">' + o.status + '</span>' +
              '</div>' +

              // Status Steps
              '<div class="grid grid-cols-2 gap-2 text-center text-[11px] font-bold">' +
                '<div class="p-2.5 rounded-2xl border ' + (isAccepted ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-amber-50 border-amber-200 text-amber-800') + '">' + (isAccepted ? '✓ Boutique Accepted' : '⏳ Waiting Acceptance') + '</div>' +
                '<div class="p-2.5 rounded-2xl border ' + (isPickedUp ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-500') + '">' + (isPickedUp ? '⚡ Rider Picked Up' : 'Rider Pending') + '</div>' +
              '</div>' +

              // Item details
              '<div class="bg-slate-50 rounded-2xl p-4 space-y-2 text-xs border border-slate-100">' +
                '<div class="flex justify-between font-bold text-slate-950">' +
                  '<span>Outfit: ' + (o.items && o.items[0] ? o.items[0].name : 'Fashion Item') + '</span>' +
                  '<span class="font-mono-num text-orange-600">₹' + o.totalAmount + '</span>' +
                '</div>' +
                '<p class="text-slate-500 text-[11px]">📍 Delivery Address: ' + o.customerAddress + '</p>' +
              '</div>' +

              // Direct WhatsApp Connect buttons for Boutique & Rider coordination
              '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">' +
                '<a href="' + storeWhatsAppUrl + '" target="_blank" class="flex items-center justify-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold py-2.5 px-3 rounded-2xl text-xs transition border border-emerald-200">' +
                  '<span>💬</span> <span>Chat with Boutique Partner</span>' +
                '</a>' +
                '<a href="https://wa.me/919515552511?text=Hi%20Rider%2C%20regarding%20order%20%23' + o.orderId + '%2C%20please%20deliver%20fast%20urgently." target="_blank" class="flex items-center justify-center gap-2 bg-orange-50 hover:bg-orange-100 text-orange-800 font-bold py-2.5 px-3 rounded-2xl text-xs transition border border-orange-200">' +
                  '<span>⚡</span> <span>Contact Delivery Rider</span>' +
                '</a>' +
              '</div>' +

              // Secure Delivery OTP Box
              (!isDelivered ? 
                '<div class="flex items-center justify-between bg-amber-50 border border-amber-200 p-3.5 rounded-2xl">' +
                  '<div class="space-y-0.5">' +
                    '<p class="text-[10px] font-black uppercase text-amber-800 tracking-wider">🔒 Secure Delivery OTP</p>' +
                    '<p class="text-[11px] text-amber-700">Share this with arrival rider to verify & complete.</p>' +
                  '</div>' +
                  '<span class="font-mono-num font-black text-xl text-slate-950 bg-white px-3 py-1.5 rounded-xl border border-amber-300 tracking-widest shadow-2xs">' + o.deliveryOtp + '</span>' +
                '</div>' 
                :
                '<div class="bg-emerald-50 border border-emerald-200 text-emerald-800 font-bold text-center py-3 rounded-2xl text-xs">' +
                  '🎉 Order Delivered & Paid Successfully!' +
                '</div>'
              ) +

              (!isDelivered && !isAccepted ? 
                '<button onclick="cancelCustomerOrder(\'' + o.orderId + '\')" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold py-2.5 rounded-2xl text-xs transition cursor-pointer">' +
                  '✕ Cancel Order' +
                '</button>' 
                : ''
              ) +
            '</div>';
          }
        });

        if (myOrdersCount === 0) {
          container.innerHTML = '<div class="bg-white rounded-3xl p-10 border border-slate-200 text-center space-y-3 shadow-sm">' +
            '<p class="text-4xl">📦</p>' +
            '<h3 class="font-brand font-bold text-base text-slate-950">No Active Orders Found</h3>' +
            '<p class="text-xs text-slate-500">Explore nearby boutiques and place your first express order!</p>' +
            '<a href="index.html" class="inline-block bg-orange-600 text-white font-bold px-5 py-3 rounded-2xl text-xs mt-2">Explore Stores ➔</a>' +
          '</div>';
          countBadge.innerText = "0 Orders";
        } else {
          container.innerHTML = html;
          countBadge.innerText = myOrdersCount + " Active Orders";
        }
      });
    }

    window.cancelCustomerOrder = function(orderId) {
      if (confirm("Are you sure you want to cancel order #" + orderId + "?")) {
        db.ref("orders/" + orderId).update({
          status: "Cancelled by Customer",
          delivered: true
        }).then(function() {
          alert("✓ Order cancelled successfully.");
        });
      }
    };

    loadCustomerOrders();
  </script>
</body>
</html>
